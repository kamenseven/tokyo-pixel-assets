  .name{font-size:14px;font-weight:600;margin:0}
  .jp{color:var(--acc);font-size:12px;margin:2px 0 6px}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:10.5px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
  .open{margin-top:9px;font-size:12px;color:var(--acc2)}

  #modal.on{display:flex;flex-direction:column}
  .mbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .mbar h2{font-size:15px;margin:0;flex:1}
  .mbar h2 small{color:var(--mut);font-weight:400;margin-left:8px}
  .mbtn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:13px;text-decoration:none}
  .mbtn:hover{border-color:var(--acc)}
  .mbtn.close{background:var(--acc);color:#1a1400;border-color:var(--acc);font-weight:700}
  #frame{flex:1;width:100%;border:0;background:#0e1018}
  .empty{color:var(--mut);padding:40px 26px;font-size:14px}
  html{-webkit-text-size-adjust:100%}
  body{-webkit-tap-highlight-color:transparent}
  .card,.chip,.mbtn{touch-action:manipulation}

    .genbtn small{font-size:11px}
    .genbtn .go{display:none}
    .toolbar{flex-wrap:nowrap;overflow-x:auto;padding:10px 14px;gap:7px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .toolbar::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:7px 13px;font-size:13px}
    #q{margin-left:0;flex:1 0 140px;min-width:140px;font-size:14px}
    .count{padding:6px 14px 0}

    .thumb{height:140px;padding:8px}
    .thumb img{max-height:124px}
    .card:hover{transform:none}
    .meta{padding:9px 10px 11px}
    .name{font-size:13px}
    .jp{font-size:11px}
    .tag{font-size:10px}
    .open{font-size:11px}
    .mbar{flex-wrap:wrap;gap:8px;padding:9px 12px}
    .mbar h2{font-size:14px;flex:1 1 100%}
    .mbar h2 small{display:block;margin-left:0;margin-top:2px}
    .mbtn{padding:8px 12px;font-size:13px}
    #frame{min-height:0}
  }
  @media (max-width:380px){
    .grid{grid-template-columns:repeat(2,1fr);gap:9px}
    .thumb{height:120px}
    .thumb img{max-height:104px}
  }
</style>
</head>

const CATS = {"traditional": "传统", "commercial": "商业", "residential": "住宅", "office": "办公·酒店", "civic": "公共", "infra": "基建", "vehicle": "载具", "landmark": "东京地标", "cultural": "文化", "religious": "宗教", "street": "街道设施", "nature": "自然·装饰", "japan": "日本名胜"};
let curCat = "all", curQ = "";
const chips = document.getElementById("chips");
function mkChip(id, label){
  const b = document.createElement("span");
  b.className = "chip" + (id===curCat?" on":""); b.textContent = label; b.dataset.id = id;
  b.onclick = ()=>{ curCat = id; [...chips.children].forEach(c=>c.classList.toggle("on", c.dataset.id===id)); render(); };
  chips.appendChild(b);
}
mkChip("all", "全部 ("+ASSETS.length+")");
Object.entries(CATS).forEach(([k,v])=>{
  const n = ASSETS.filter(a=>a.cat===k).length;
  if(n) mkChip(k, v+" ("+n+")");
});
const q = document.createElement("input"); q.id="q"; q.placeholder="搜索名称 / 功能…";
q.oninput = ()=>{ curQ = q.value.trim().toLowerCase(); render(); };
chips.appendChild(q);

const grid = document.getElementById("grid");
function render(){
  grid.innerHTML = "";
  const list = ASSETS.filter(a =>
    (curCat==="all" || a.cat===curCat) &&
    (!curQ || (a.en+a.jp+a.fn+a.id).toLowerCase().includes(curQ)));
  document.getElementById("count").textContent = "显示 "+list.length+" / "+ASSETS.length+" 个资产";
  document.getElementById("empty").style.display = list.length?"none":"block";
  list.forEach(a=>{
    const c = document.createElement("div"); c.className="card";
    c.innerHTML =
      '<div class="thumb"><span class="cat">'+(CATS[a.cat]||a.cat)+'</span>'+
      '<img loading="lazy" src="'+a.thumb+'" alt="'+a.en+'"></div>'+
      '<div class="meta"><p class="name">'+a.en+'</p><div class="jp">'+a.jp+'</div>'+
      '<div class="tags"><span class="tag">'+a.fn+'</span><span class="tag">~'+a.hm+' m</span>'+
      '<span class="tag">'+a.slices+' 切片</span></div>'+
      '<div class="open">▶ 打开可旋转 viewer</div></div>';
    c.onclick = ()=>openViewer(a);
    grid.appendChild(c);
  });
}
const modal=document.getElementById("modal"), frame=document.getElementById("frame");
function openViewer(a){
  document.getElementById("mtitle").innerHTML = a.en+' <small>'+a.jp+' · '+a.fn+' · '+a.slices+' 切片</small>';
  document.getElementById("mnew").href = a.viewer;
  frame.src = a.viewer;
  modal.classList.add("on"); document.body.style.overflow="hidden";
}
function closeViewer(){ modal.classList.remove("on"); frame.src="about:blank"; document.body.style.overflow=""; }
document.getElementById("mclose").onclick = closeViewer;
modal.onclick = e=>{ if(e.target===modal) closeViewer(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeViewer(); });
render();
</script>
