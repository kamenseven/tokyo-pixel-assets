const CATS = {"traditional": "传统", "commercial": "商业", "residential": "住宅", "office": "办公·酒店", "civic": "公共", "infra": "基建", "vehicle": "载具", "landmark": "东京地标", "cultural": "文化", "religious": "宗教", "street": "街道设施", "nature": "自然·装饰", "japan": "日本名胜", "green": "绿化·树木", "streetnew": "街区新元素", "vehicle2": "载具扩充", "props": "设施道具"};
const GROUPS = {"building": "城市建筑", "street": "街道·设施", "nature": "绿化·自然", "vehicle": "载具", "landmark": "地标·名胜", "heritage": "传统建筑", "character": "角色", "other": "其他"};
const SUBCATS = {"办公·住宿": "办公·住宿", "住宅": "住宅", "商业·餐饮": "商业·餐饮", "公共机构": "公共机构", "交通·工业": "交通·工业", "传统建筑": "传统建筑", "东京地标": "东京地标", "日本名胜": "日本名胜", "树木": "树木", "城市绿化": "城市绿化", "装饰小品": "装饰小品", "汽车·两轮": "汽车·两轮", "铁路车辆": "铁路车辆", "航空器": "航空器", "装甲·军用": "装甲·军用", "船舶": "船舶", "工程车辆": "工程车辆", "街道家具": "街道家具", "交通标志": "交通标志", "交通站点": "交通站点", "街区场景": "街区场景", "街景地标": "街景地标", "铁路设施": "铁路设施", "道路设施": "道路设施", "祭典": "祭典", "餐饮摊": "餐饮摊", "公园游乐": "公园游乐", "施工机械": "施工机械", "能源设施": "能源设施", "港口物流": "港口物流", "机场地面": "机场地面", "农业郊外": "农业郊外", "其他": "其他", "二头身角色": "二头身角色"};
let curGroup = "all", curCat = "all", curQ = "";
const chips = document.getElementById("chips");
const chips2 = document.getElementById("chips2");
function mkChip(el, id, label, on, active){
  const b = document.createElement("span");
  b.className = "chip" + (active?" on":""); b.textContent = label; b.dataset.id = id;
  b.onclick = on;
  el.appendChild(b);
}
function buildChips(){
  chips.innerHTML = "";
  const gc = {}; ASSETS.forEach(a=>{ gc[a.group] = (gc[a.group]||0)+1; });
  mkChip(chips, "all", "全部 ("+ASSETS.length+")", ()=>{curGroup="all";curCat="all";buildChips();render();}, curGroup==="all");
  Object.entries(GROUPS).forEach(([k,v])=>{
    if(!gc[k]) return;
    mkChip(chips, k, v+" ("+gc[k]+")", ()=>{curGroup=k;curCat="all";buildChips();render();}, curGroup===k);
  });
  chips2.innerHTML = "";
  const pool = ASSETS.filter(a=> curGroup==="all" || a.group===curGroup);
  const cc = {}; pool.forEach(a=>{ cc[a.sub] = (cc[a.sub]||0)+1; });
  mkChip(chips2, "all", "全部小类 ("+pool.length+")", ()=>{curCat="all";buildChips();render();}, curCat==="all");
  Object.entries(SUBCATS).forEach(([k,v])=>{
    if(!cc[k]) return;
    mkChip(chips2, k, v+" ("+cc[k]+")", ()=>{curCat=k;buildChips();render();}, curCat===k);
  });
  const q = document.createElement("input"); q.id="q"; q.placeholder="搜索名称 / 功能…"; q.value = curQ;
  q.oninput = ()=>{ curQ = q.value.trim().toLowerCase(); render(); };
  chips2.appendChild(q);
}

const grid = document.getElementById("grid");
function render(){
  grid.innerHTML = "";
  const list = ASSETS.filter(a =>
    (curGroup==="all" || a.group===curGroup) &&
    (curCat==="all" || a.sub===curCat) &&
    (!curQ || (a.en+a.jp+a.fn+a.id).toLowerCase().includes(curQ)));
  document.getElementById("count").textContent = "显示 "+list.length+" / "+ASSETS.length+" 个资产";
  document.getElementById("empty").style.display = list.length?"none":"block";
  list.forEach(a=>{
    const c = document.createElement("div"); c.className="card";
    c.innerHTML =
      '<div class="thumb"><span class="cat">'+(a.sub||"其他")+'</span>'+
      '<img loading="lazy" src="'+a.thumb+'" alt="'+a.en+'"></div>'+
      '<div class="meta"><p class="name">'+a.en+'</p><div class="jp">'+a.jp+'</div>'+
      '<div class="tags"><span class="tag">'+(GROUPS[a.group]||a.group)+'</span><span class="tag">~'+a.hm+' m</span>'+
      '<span class="tag">'+a.slices+' 切片</span></div>'+
      '<div class="open">▶ 打开可旋转 viewer</div></div>';
    c.onclick = ()=>openViewer(a);
    grid.appendChild(c);
  });
}
const modal=document.getElementById("modal"), frame=document.getElementById("frame");
function openViewer(a){
  document.getElementById("mtitle").innerHTML = a.en+' <small>'+a.jp+' · '+a.fn+' · '+a.slices+' 切片</small>';
  document.getElementById("mnew").href = a.viewer;
  frame.src = a.viewer;
  modal.classList.add("on"); document.body.style.overflow="hidden";
}
function closeViewer(){ modal.classList.remove("on"); frame.src="about:blank"; document.body.style.overflow=""; }
document.getElementById("mclose").onclick = closeViewer;
modal.onclick = e=>{ if(e.target===modal) closeViewer(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeViewer(); });
buildChips();
render();
</script>
