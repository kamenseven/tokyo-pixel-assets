// Cache rasterized prop sprites so repeated props (e.g. 4 trees, 4 lamps) rasterize ONCE per angle/light bucket
function getCachedPropSprite(propKey, vol, angleDeg, squash, spacing) {
  const qAng = Math.round((((angleDeg % 360) + 360) % 360) / 2) * 2;
  const qSq = Math.round(squash * 50);
  const qSp = Math.round(spacing * 10);
  const qSnow = Math.round(weather.snowCover * 4);
  const key = `${propKey}|${qAng}|${qSq}|${qSp}|${state.timeOfDay}|${Math.round(state.sunAngle / 3)}|${state.lighting ? 1 : 0}|${state.shadow ? 1 : 0}|${state.outline ? 1 : 0}|${qSnow}`;
  const hit = propCache.get(key);
  if (hit) return hit;

  const buf = rasterizeStackIntoScratch({
    vol,
    angleDeg: qAng,
    squash,
    spacing,
    maxSlices: vol.n,
    shadow: state.shadow,
    outline: state.outline,
  });
  const copy = document.createElement("canvas");
  copy.width = buf.width;
  copy.height = buf.height;
  copy.getContext("2d").drawImage(buf, 0, 0);
  const entry = { canvas: copy, cx: scratch.cx, baseY: scratch.baseY };

  if (propCache.size >= PROP_CACHE_MAX) {
    const oldest = propCache.keys().next().value;
    propCache.delete(oldest);
  }
  propCache.set(key, entry);
  return entry;
}

// ============================================================
// WEATHER ENGINE: RAIN, WET REFLECTIONS & SNOW CAP
// ============================================================
function updateWeather(dt) {
  weather.time += dt;
  const targetSnow = state.weather === "snow" ? 1 : 0;
  const targetWet = state.weather === "rain" ? 1 : 0;
  weather.snowCover += (targetSnow - weather.snowCover) * Math.min(1, dt * (targetSnow > weather.snowCover ? 0.42 : 1.8));
  weather.wetness += (targetWet - weather.wetness) * Math.min(1, dt * 2.5);
  if (Math.abs(targetSnow - weather.snowCover) < 0.005) weather.snowCover = targetSnow;
  if (Math.abs(targetWet - weather.wetness) < 0.005) weather.wetness = targetWet;

  if (state.weather === "rain") {
    for (let i = 0; i < RAIN_COUNT; i++) {
      const b = i * 4;
      weather.rain[b] -= weather.rain[b + 2] * 0.22 * dt;
      weather.rain[b + 1] += weather.rain[b + 2] * dt;
      if (weather.rain[b + 1] > 1.05) {
        weather.rain[b + 1] -= 1.1;
        weather.rain[b] = Math.random();
      }
      if (weather.rain[b] < -0.05) weather.rain[b] += 1.1;
    }
    for (let i = 0; i < RIPPLE_COUNT; i++) {
      const b = i * 4;
      weather.ripples[b + 2] += dt * 1.35;
      if (weather.ripples[b + 2] >= 1) {
        weather.ripples[b] = Math.random();
        weather.ripples[b + 1] = 0.28 + Math.random() * 0.68;
        weather.ripples[b + 2] = 0;
        weather.ripples[b + 3] = 4 + Math.floor(Math.random() * 4);
      }
    }
  } else if (state.weather === "snow") {
    for (let i = 0; i < SNOW_COUNT; i++) {
      const b = i * 4;
      weather.snow[b] += Math.sin(weather.time * 1.4 + weather.snow[b + 3]) * 0.045 * dt;
      weather.snow[b + 1] += weather.snow[b + 2] * dt;
      if (weather.snow[b + 1] > 1.04) {
        weather.snow[b + 1] -= 1.08;
        weather.snow[b] = Math.random();
      }
      if (weather.snow[b] < 0) weather.snow[b] += 1;
      if (weather.snow[b] > 1) weather.snow[b] -= 1;
    }
  }
}

// Draw crisp wavy upside-down wet reflection of a rasterized sprite canvas
function drawWetReflection(targetCtx, srcCanvas, dstX, dstY, s, baseY, alpha) {
  if (alpha <= 0.02) return;
  const sw = srcCanvas.width;
  const reflH = Math.min(srcCanvas.height - 2, Math.max(8, Math.round(baseY * 0.92)));
  if (reflH <= 0) return;

  targetCtx.save();
  targetCtx.imageSmoothingEnabled = false;
  targetCtx.globalAlpha = alpha;
  const phase = weather.time * 5.2;
  // Draw in 2-art-pixel horizontal strips with subtle sine ripple
  for (let row = 0; row < reflH; row += 2) {
    const srcY = baseY - row - 2;
    if (srcY < 0 || srcY + 2 > srcCanvas.height) continue;
    const wave = Math.round(Math.sin(row * 0.42 + phase) * (0.6 + row * 0.03));
    const fade = 1 - row / reflH;
    targetCtx.globalAlpha = alpha * fade;
    targetCtx.drawImage(
      srcCanvas,
      0, srcY, sw, 2,
      dstX + wave * s, dstY + (baseY + Math.round(row * 0.72)) * s, sw * s, 2 * s
    );
  }
  targetCtx.restore();
}

function drawWeatherGroundEffects(targetCtx, aw, ah, s, env) {
  if (state.weather !== "rain") return;
  targetCtx.fillStyle = env.nightW > 0.45 ? "rgba(130, 185, 255, 0.34)" : "rgba(100, 130, 170, 0.28)";
  for (let i = 0; i < RIPPLE_COUNT; i++) {
    const b = i * 4;
    const age = weather.ripples[b + 2];
    const rx = Math.round(weather.ripples[b] * aw);
    const ry = Math.round(weather.ripples[b + 1] * ah);
    const r = Math.max(1, Math.round(age * weather.ripples[b + 3]));
    const rh = Math.max(1, Math.round(r * state.squash * 0.65));
    // Crisp pixel diamond/ring ripple
    targetCtx.fillRect((rx - r) * s, ry * s, s, s);
    targetCtx.fillRect((rx + r) * s, ry * s, s, s);
    targetCtx.fillRect(rx * s, (ry - rh) * s, s, s);
    targetCtx.fillRect(rx * s, (ry + rh) * s, s, s);
  }
}

function drawWeatherOverlay(targetCtx, aw, ah, s, env) {
  if (state.weather === "rain") {
    targetCtx.fillStyle = env.nightW > 0.45 ? "rgba(160, 210, 255, 0.45)" : "rgba(120, 150, 195, 0.42)";
    for (let i = 0; i < RAIN_COUNT; i++) {
      const b = i * 4;
      const rx = Math.round(weather.rain[b] * aw);
      const ry = Math.round(weather.rain[b + 1] * ah);
      const len = weather.rain[b + 3] | 0;
      for (let k = 0; k < len; k++) {
        targetCtx.fillRect((rx - (k >> 1)) * s, (ry + k) * s, s, s);
      }
    }
  } else if (state.weather === "snow") {
    targetCtx.fillStyle = env.nightW > 0.45 ? "rgba(225, 240, 255, 0.85)" : "rgba(255, 255, 255, 0.92)";
    for (let i = 0; i < SNOW_COUNT; i++) {
      const b = i * 4;
      const sx = Math.round(weather.snow[b] * aw);
      const sy = Math.round(weather.snow[b + 1] * ah);
      const sz = (i & 3) === 0 ? 2 : 1;
      targetCtx.fillRect(sx * s, sy * s, sz * s, sz * s);
    }
  }
}

// ============================================================
// LIVING DIORAMA + MULTI-ASSET WORLD RENDERER
// ============================================================
function getSceneLayout(sceneName) {
  if (sceneName === "street") {
    return [
      { key: "lamp", vol: PROCEDURAL_PROPS.lamp, x: -34, y: -27, rot: 90 },
      { key: "lamp", vol: PROCEDURAL_PROPS.lamp, x: 34, y: -27, rot: 90 },
      { key: "kiosk", vol: PROCEDURAL_PROPS.kiosk, x: 2, y: -32, rot: 0 },
      { key: "bollard", vol: PROCEDURAL_PROPS.bollard, x: -36, y: 24, rot: 0 },
      { key: "bollard", vol: PROCEDURAL_PROPS.bollard, x: 36, y: 24, rot: 0 },
      { key: "lamp", vol: PROCEDURAL_PROPS.lamp, x: 0, y: 31, rot: 270 },
    ];
  }
  // Meadow Island
  return [
    { key: "pine", vol: PROCEDURAL_PROPS.pine, x: -32, y: -24, rot: 0 },
    { key: "pine", vol: PROCEDURAL_PROPS.pine, x: 30, y: -25, rot: 90 },
    { key: "pine", vol: PROCEDURAL_PROPS.pine, x: -26, y: 26, rot: 180 },
    { key: "rock", vol: PROCEDURAL_PROPS.rock, x: 28, y: 22, rot: 45 },
    { key: "meadowLamp", vol: PROCEDURAL_PROPS.meadowLamp, x: 18, y: -15, rot: 120 },
  ];
}

// Cached 112x112 pixel-art diorama ground texture (rebuilt only when scene/lighting/weather changes -> <0.1ms/frame draw!)
const groundTex = { key: "", canvas: document.createElement("canvas"), ctx: null };
groundTex.canvas.width = 112;
groundTex.canvas.height = 112;
groundTex.ctx = groundTex.canvas.getContext("2d");

function getDioramaGroundTex(sceneName, env) {
  const qSnow = Math.round(weather.snowCover * 4);
  const qWet = Math.round(weather.wetness * 3);
  const key = `${sceneName}|${state.timeOfDay}|${qSnow}|${qWet}`;
  if (groundTex.key === key) return groundTex.canvas;
  groundTex.key = key;

  const W = 112, H = 112, half = 56;
  const img = groundTex.ctx.createImageData(W, H);
  const d32 = new Uint32Array(img.data.buffer);
  const wet = weather.wetness;
  const snow = weather.snowCover;
  const nW = env.nightW;
  const sW = env.sunsetW;

  const hash = (x, y) => {
    let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) & 255;
  };

  for (let py = 0; py < H; py++) {
    const wy = py - half;
    for (let px = 0; px < W; px++) {
      const wx = px - half;
      const n = hash(px, py);
      let r, g, b;

      if (sceneName === "street") {
        const isSidewalk = wy < -20 || wy >= 20;
        const isCurb = wy === -20 || wy === -21 || wy === 20 || wy === 21;
        if (isCurb) {
          // Crisp beveled concrete curb edge
          const hi = (wy === -21 || wy === 20) ? 24 : -14;
          r = lerp(lerp(154, 148, sW), 58, nW) + hi;
          g = lerp(lerp(164, 140, sW), 70, nW) + hi;
          b = lerp(lerp(178, 148, sW), 96, nW) + hi;
        } else if (isSidewalk) {
          // Tiled concrete paving slabs with dark mortar grid
          const isSeam = ((px & 7) === 0) || ((py & 7) === 0);
          const grain = (n & 7) - 3;
          const tileVar = (((px >> 3) + (py >> 3)) & 1) ? 5 : -4;
          const delta = isSeam ? -24 : (grain + tileVar);
          r = lerp(lerp(142, 138, sW), 44, nW) + delta;
          g = lerp(lerp(152, 130, sW), 54, nW) + delta;
          b = lerp(lerp(166, 138, sW), 78, nW) + delta;
        } else {
          // Textured asphalt road + zebra crosswalk + dashed center line + manhole cover
          const grain = (n & 15) - 7;
          r = lerp(lerp(58, 54, sW), 20, nW) + grain * 0.7;
          g = lerp(lerp(66, 52, sW), 26, nW) + grain * 0.7;
          b = lerp(lerp(80, 64, sW), 42, nW) + grain * 0.7;

          // Zebra crosswalk near x = -46..-34
          if (wx >= -46 && wx <= -34 && (Math.abs(wy) % 6) < 3 && Math.abs(wy) < 18) {
            r = lerp(lerp(222, 228, sW), 116, nW);
            g = lerp(lerp(226, 206, sW), 126, nW);
            b = lerp(lerp(232, 192, sW), 148, nW);
          }
          // Yellow-gold dashed center lane markers
          if (wy >= -1 && wy <= 1 && wx > -28 && (((wx + 60) % 18) < 9)) {
            r = lerp(lerp(245, 250, sW), 210, nW);
            g = lerp(lerp(205, 185, sW), 165, nW);
            b = lerp(lerp(75, 70, sW), 72, nW);
          }
          // Cast-iron manhole cover at (22, 8)
          const md = Math.hypot(wx - 22, wy - 8);
          if (md < 4.5) {
            const rim = md > 3.2 || ((px + py) & 1) === 0;
            r = lerp(rim ? 78 : 54, rim ? 38 : 26, nW);
            g = lerp(rim ? 86 : 60, rim ? 46 : 32, nW);
            b = lerp(rim ? 98 : 72, rim ? 64 : 46, nW);
          }
          // Wet asphalt sheen & puddle darken in rain
          if (wet > 0) {
            const puddle = (Math.sin(wx * 0.14) * Math.cos(wy * 0.19) > 0.35);
            const f = puddle ? (1 - wet * 0.38) : (1 - wet * 0.2);
            r *= f; g *= f; b *= (puddle ? (1 - wet * 0.1) : f);
          }
        }
        if (snow > 0) {
          const snAmt = isSidewalk ? snow * 0.92 : snow * 0.55;
          const snR = lerp(234, 132, nW), snG = lerp(242, 152, nW), snB = lerp(255, 196, nW);
          r = lerp(r, snR, snAmt); g = lerp(g, snG, snAmt); b = lerp(b, snB, snAmt);
        }
      } else {
        // Meadow Island: winding pebbled dirt trail, dappled multi-tone pixel grass, tiny colorful wildflowers
        const pathCenter = Math.sin(wx * 0.055) * 6;
        const distPath = Math.abs(wy - pathCenter);
        const edgeNoise = ((n & 7) - 3) * 0.45;
        if (distPath < 10.5 + edgeNoise) {
          // Warm pebbled dirt path with occasional stone pebbles
          const isPebble = n > 236;
          const grain = (n & 15) - 7;
          if (isPebble) {
            r = lerp(164, 72, nW); g = lerp(158, 76, nW); b = lerp(150, 92, nW);
          } else {
            r = lerp(lerp(194, 198, sW), 74, nW) + grain;
            g = lerp(lerp(160, 144, sW), 62, nW) + grain;
            b = lerp(lerp(116, 98, sW), 56, nW) + grain * 0.8;
          }
        } else {
          // Rich dappled grass with blade tufts & wildflowers
          const tuft = (n & 31) < 5 ? 14 : ((n & 31) > 27 ? -16 : 0);
          r = lerp(lerp(88, 114, sW), 26, nW) + tuft * 0.7;
          g = lerp(lerp(158, 126, sW), 62, nW) + tuft;
          b = lerp(lerp(76, 66, sW), 52, nW) + tuft * 0.5;
          // Scattered pixel wildflowers (yellow, pink, white)
          if (n === 17 || n === 113) { r = lerp(255, 175, nW); g = lerp(228, 165, nW); b = lerp(96, 110, nW); }
          else if (n === 71) { r = lerp(255, 165, nW); g = lerp(138, 96, nW); b = lerp(186, 140, nW); }
          else if (n === 203) { r = lerp(248, 170, nW); g = lerp(250, 185, nW); b = lerp(255, 215, nW); }
        }
        if (snow > 0) {
          const snAmt = snow * (distPath < 11 ? 0.75 : 0.92);
          const snR = lerp(236, 136, nW), snG = lerp(244, 156, nW), snB = lerp(255, 200, nW);
          r = lerp(r, snR, snAmt); g = lerp(g, snG, snAmt); b = lerp(b, snB, snAmt);
        }
      }

      // Crisp 1px border edge rim on the floating diorama top
      if (px === 0 || px === W - 1 || py === 0 || py === H - 1) {
        r *= 0.68; g *= 0.68; b *= 0.68;
      }
      d32[py * W + px] = packABGR(clampByte(r), clampByte(g), clampByte(b), 255);
    }
  }
  groundTex.ctx.putImageData(img, 0, 0);
  return groundTex.canvas;
}

function drawDioramaGround(targetCtx, aw, ah, cx, cy, s, ca, sa, squash, env, sceneName) {
  const half = 56;
  const nW = env.nightW;
  const snow = weather.snowCover;
  const proj = (wx, wy, z = 0) => [
    Math.round(cx + (wx * ca - wy * sa)) * s,
    Math.round(cy + (wx * sa + wy * ca) * squash - z) * s,
  ];

  // 1. Multi-layer floating diorama plinth side walls (top turf/curb lip + thick rock/soil slab)
  const corners = [[-half, -half], [half, -half], [half, half], [-half, half]];
  const topPts = corners.map(([x, y]) => proj(x, y, 0));
  const lipPts = corners.map(([x, y]) => proj(x, y, -3));
  const botPts = corners.map(([x, y]) => proj(x, y, -11));

  const lipColA = sceneName === "street"
    ? (nW > 0.45 ? "#2e3a56" : "#94a3b8")
    : (snow > 0.5 ? (nW > 0.45 ? "#92aacf" : "#dce8f8") : (nW > 0.45 ? "#24543d" : "#5ea84f"));
  const lipColB = sceneName === "street"
    ? (nW > 0.45 ? "#222b42" : "#77889e")
    : (snow > 0.5 ? (nW > 0.45 ? "#7a92b8" : "#c6d6ea") : (nW > 0.45 ? "#1a3f30" : "#498a3f"));
  const sideColA = sceneName === "street"
    ? (nW > 0.45 ? "#1b2234" : "#64748b")
    : (nW > 0.45 ? "#382a24" : "#946846");
  const sideColB = sceneName === "street"
    ? (nW > 0.45 ? "#121726" : "#475569")
    : (nW > 0.45 ? "#261c18" : "#734e34");

  for (let i = 0; i < 4; i++) {
    const j = (i + 1) & 3;
    if ((topPts[i][1] + topPts[j][1]) * 0.5 > cy * s) {
      // Lower soil / concrete foundation
      targetCtx.fillStyle = (i & 1) ? sideColA : sideColB;
      targetCtx.beginPath();
      targetCtx.moveTo(lipPts[i][0], lipPts[i][1]);
      targetCtx.lineTo(lipPts[j][0], lipPts[j][1]);
      targetCtx.lineTo(botPts[j][0], botPts[j][1]);
      targetCtx.lineTo(botPts[i][0], botPts[i][1]);
      targetCtx.closePath();
      targetCtx.fill();
      // Upper grass / curb overhanging lip
      targetCtx.fillStyle = (i & 1) ? lipColA : lipColB;
      targetCtx.beginPath();
      targetCtx.moveTo(topPts[i][0], topPts[i][1]);
      targetCtx.lineTo(topPts[j][0], topPts[j][1]);
      targetCtx.lineTo(lipPts[j][0], lipPts[j][1]);
      targetCtx.lineTo(lipPts[i][0], lipPts[i][1]);
      targetCtx.closePath();
      targetCtx.fill();
    }
  }

  // 2. Blit cached 112x112 pixel-art ground texture rotated & squashed in one nearest-neighbor drawImage!
  const tex = getDioramaGroundTex(sceneName, env);
  targetCtx.save();
  targetCtx.imageSmoothingEnabled = false;
  targetCtx.translate(cx * s, cy * s);
  targetCtx.scale(s, s * squash);
  targetCtx.rotate(Math.atan2(sa, ca));
  targetCtx.drawImage(tex, -half, -half, half * 2, half * 2);
  targetCtx.restore();
}

function drawSceneFrame() {
  const rect = stage.getBoundingClientRect();
  const s = Math.max(2, Math.min(7, state.scale));
  const aw = Math.max(150, Math.min(300, Math.floor(rect.width / s)));
  const ah = Math.max(115, Math.min(220, Math.floor(rect.height / s)));
  const cw = aw * s, ch = ah * s;
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }

  const env = getLightingEnv(state.timeOfDay, state.sunAngle);
  const cx = aw >> 1;
  const cy = Math.round(ah * 0.57);
  const rad = (state.angle * Math.PI) / 180;
  const ca = Math.cos(rad), sa = Math.sin(rad);

  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = env.bgHex;
  ctx.fillRect(0, 0, cw, ch);

  // 1. Draw diorama plinth & ground
  drawDioramaGround(ctx, aw, ah, cx, cy, s, ca, sa, state.squash, env, state.scene);

  // 2. Ground rain ripples
  drawWeatherGroundEffects(ctx, aw, ah, s, env);

  // 3. Gather hero + procedural props + user-dropped extra props, then Y-sort by rotated screen depth!
  const items = [];
  items.push({ kind: "hero", x: 0, y: 0, rot: 0, vol: state.vol, key: "hero" });
  const layout = getSceneLayout(state.scene);
  for (let i = 0; i < layout.length; i++) {
    const p = layout[i];
    items.push({ kind: "prop", x: p.x, y: p.y, rot: p.rot, vol: p.vol, key: p.key });
  }
  for (let i = 0; i < state.userProps.length; i++) {
    const up = state.userProps[i];
    items.push({ kind: "prop", x: up.x, y: up.y, rot: up.rot, vol: up.vol, key: `u${i}_${up.name}` });
  }

  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    it.sx = cx + (it.x * ca - it.y * sa);
    it.sy = cy + (it.x * sa + it.y * ca) * state.squash;
  }
  items.sort((a, b) => a.sy - b.sy);

  // 4. Draw wet reflections + stacked sprites back-to-front
  const reflAlpha = weather.wetness * (state.scene === "street" ? (env.nightW > 0.45 ? 0.52 : 0.36) : 0.24);
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    let imgCanvas, icx, ibaseY;
    if (it.kind === "hero") {
      imgCanvas = rasterizeStackIntoScratch({
        vol: state.vol,
        angleDeg: state.angle,
        squash: state.squash,
        spacing: state.spacing,
        maxSlices: state.slices,
        shadow: state.shadow,
        outline: state.outline,
      });
      icx = scratch.cx;
      ibaseY = scratch.baseY;
    } else {
      const cached = getCachedPropSprite(it.key, it.vol, state.angle + it.rot, state.squash, state.spacing);
      imgCanvas = cached.canvas;
      icx = cached.cx;
      ibaseY = cached.baseY;
    }
    const ox = Math.round(it.sx - icx) * s;
    const oy = Math.round(it.sy - ibaseY) * s;
    if (reflAlpha > 0.02) {
      drawWetReflection(ctx, imgCanvas, ox, oy, s, ibaseY, reflAlpha);
    }
    ctx.drawImage(imgCanvas, ox, oy, imgCanvas.width * s, imgCanvas.height * s);
  }

  // 5. Weather foreground streaks / snowflakes
  drawWeatherOverlay(ctx, aw, ah, s, env);

  const label = state.scene === "street" ? "Neon Street" : "Meadow Island";
  const extra = state.userProps.length ? ` · +${state.userProps.length} prop${state.userProps.length > 1 ? "s" : ""}` : "";
  readout.textContent = `${label}${extra} · ${Math.round(((state.angle % 360) + 360) % 360)}° · ${state.lastRenderMs.toFixed(1)}ms`;
}

// ============================================================
// TOY MODE: DRIVE (Infinite scrolling pixel arena + physics)
// ============================================================
function updateDrive(dt) {
  const maxSpeed = 78;
  const accel = 135;
  const brakeForce = 185;
  const throttle = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
  const steerIn = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

  const fx = Math.cos(drive.heading);
  const fy = Math.sin(drive.heading);
  const rx = -fy;
  const ry = fx;

  let fwd = drive.vx * fx + drive.vy * fy;
  let lat = drive.vx * rx + drive.vy * ry;

  if (throttle !== 0) {
    fwd += throttle * (Math.sign(throttle) !== Math.sign(fwd) && Math.abs(fwd) > 4 ? brakeForce : accel) * dt;
  } else {
    fwd *= Math.exp(-2.8 * dt);
  }
  fwd = Math.max(-maxSpeed * 0.48, Math.min(maxSpeed, fwd));

  const speedNorm = Math.min(1, Math.abs(fwd) / 36);
  const turnRate = (keys.brake ? 4.3 : 3.2) * (fwd >= -2 ? 1 : -1);
  drive.heading += steerIn * turnRate * speedNorm * dt;

  // Lateral grip: low grip when drifting (Space) -> juicy power slides!
  const grip = keys.brake ? 2.1 : 8.5;
  lat *= Math.exp(-grip * dt);

  const nfx = Math.cos(drive.heading);
  const nfy = Math.sin(drive.heading);
  const nrx = -nfy;
  const nry = nfx;
  drive.vx = nfx * fwd + nrx * lat;
  drive.vy = nfy * fwd + nry * lat;
  drive.x += drive.vx * dt;
  drive.y += drive.vy * dt;
  drive.speed = Math.hypot(drive.vx, drive.vy);
  drive.drifting = (keys.brake && Math.abs(fwd) > 16) || Math.abs(lat) > 14;

  // Suspension bounce & body roll/lean into turns
  const targetLean = -steerIn * speedNorm * (keys.brake ? 2.8 : 1.6);
  drive.lean += (targetLean - drive.lean) * Math.min(1, dt * 12);
  if (Math.abs(throttle) > 0 && Math.abs(fwd) < 25) drive.bounceVel += 0.9 * dt;
  drive.bounceVel += (-drive.bounce * 38 - drive.bounceVel * 7) * dt;
  drive.bounce += drive.bounceVel * dt;

  // Emit tire skid marks when drifting
  if (drive.drifting) {
    const offSide = 5;
    for (const sgn of [-1, 1]) {
      const i = drive.skidHead * 3;
      drive.skids[i] = drive.x - nfx * 6 + nrx * offSide * sgn;
      drive.skids[i + 1] = drive.y - nfy * 6 + nry * offSide * sgn;
      drive.skids[i + 2] = 1.0;
      drive.skidHead = (drive.skidHead + 1) % 240;
    }
  }
  for (let i = 0; i < 240; i++) {
    if (drive.skids[i * 3 + 2] > 0) drive.skids[i * 3 + 2] = Math.max(0, drive.skids[i * 3 + 2] - dt * 0.25);
  }

  // Emit exhaust / drift smoke puffs
  drive.puffTimer -= dt;
  if ((drive.speed > 10 || drive.drifting) && drive.puffTimer <= 0) {
    drive.puffTimer = drive.drifting ? 0.035 : 0.09;
    const i = drive.puffHead * 6;
    drive.puffs[i] = drive.x - nfx * 9 + (Math.random() - 0.5) * 3;
    drive.puffs[i + 1] = drive.y - nfy * 9 + (Math.random() - 0.5) * 3;
    drive.puffs[i + 2] = 2 + Math.random() * 2;
    drive.puffs[i + 3] = -nfx * 6 + (Math.random() - 0.5) * 8;
    drive.puffs[i + 4] = -nfy * 6 + (Math.random() - 0.5) * 8;
    drive.puffs[i + 5] = 1.0;
    drive.puffHead = (drive.puffHead + 1) % 96;
  }
  for (let i = 0; i < 96; i++) {
    const base = i * 6;
    if (drive.puffs[base + 5] > 0) {
      drive.puffs[base] += drive.puffs[base + 3] * dt;
      drive.puffs[base + 1] += drive.puffs[base + 4] * dt;
      drive.puffs[base + 2] += 10 * dt;
      drive.puffs[base + 5] = Math.max(0, drive.puffs[base + 5] - dt * 1.45);
    }
  }

  // Sync angle slider to vehicle heading (+90° aligns top-down nose with +X heading)
  state.angle = (((drive.heading * 180) / Math.PI - 90) % 360 + 360) % 360;
}

function drawDriveFrame() {
  const rect = stage.getBoundingClientRect();
  const s = Math.max(2, Math.min(8, state.scale));
  const aw = Math.max(120, Math.min(280, Math.floor(rect.width / s)));
  const ah = Math.max(90, Math.min(200, Math.floor(rect.height / s)));
  const cw = aw * s, ch = ah * s;
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }

  const env = getLightingEnv(state.timeOfDay, state.sunAngle);
  const cx = aw >> 1;
  const cy = (ah >> 1) + 10;
  const world = state.driveWorld;
  const snow = weather.snowCover;
  const wet = weather.wetness;

  ctx.imageSmoothingEnabled = false;
  // Ground fill adapted to Drive World, Time of Day, Rain wetness & Snow
  if (world === "street") {
    let r = lerp(lerp(66, 58, env.sunsetW), 22, env.nightW);
    let g = lerp(lerp(74, 56, env.sunsetW), 28, env.nightW);
    let b = lerp(lerp(88, 68, env.sunsetW), 44, env.nightW);
    if (wet > 0) { r *= (1 - wet * 0.28); g *= (1 - wet * 0.24); b *= (1 - wet * 0.14); }
    if (snow > 0) { r = lerp(r, lerp(230, 120, env.nightW), snow * 0.65); g = lerp(g, lerp(238, 138, env.nightW), snow * 0.65); b = lerp(b, lerp(250, 182, env.nightW), snow * 0.65); }
    ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
  } else if (world === "island") {
    let r = lerp(lerp(106, 124, env.sunsetW), 32, env.nightW);
    let g = lerp(lerp(164, 130, env.sunsetW), 62, env.nightW);
    let b = lerp(lerp(90, 74, env.sunsetW), 54, env.nightW);
    if (snow > 0) { r = lerp(r, lerp(236, 130, env.nightW), snow * 0.85); g = lerp(g, lerp(244, 150, env.nightW), snow * 0.85); b = lerp(b, lerp(255, 195, env.nightW), snow * 0.85); }
    ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
  } else {
    ctx.fillStyle = env.bgHex;
  }
  ctx.fillRect(0, 0, cw, ch);

  if (world === "street") {
    // Infinite scrolling horizontal boulevard with curbs and dashed center line
    const roadBand = 128;
    const offX = ((-drive.x % 24) + 24) % 24;
    const relRoadY = ((-drive.y % roadBand) + roadBand) % roadBand;
    const curbCol = snow > 0.5 ? (env.nightW > 0.45 ? "#9ab0d4" : "#eef4ff") : (env.nightW > 0.45 ? "#2c3752" : "#94a3b8");
    const dashCol = env.nightW > 0.45 ? "rgba(255,224,120,0.68)" : "rgba(255,236,150,0.82)";
    for (let baseRow = relRoadY - roadBand; baseRow < ah / state.squash + roadBand; baseRow += roadBand) {
      const topCurbY = Math.round((baseRow - 44) * state.squash);
      const botCurbY = Math.round((baseRow + 26) * state.squash);
      ctx.fillStyle = curbCol;
      ctx.fillRect(0, topCurbY * s, cw, Math.max(2, Math.round(18 * state.squash)) * s);
      ctx.fillRect(0, botCurbY * s, cw, Math.max(2, Math.round(18 * state.squash)) * s);
      const dashY = Math.round(baseRow * state.squash) * s;
      ctx.fillStyle = dashCol;
      for (let gx = offX - 24; gx < aw + 24; gx += 24) {
        ctx.fillRect(Math.round(gx) * s, dashY, 10 * s, 2 * s);
      }
    }
  } else {
    const gridStep = 24;
    const offX = ((-drive.x % gridStep) + gridStep) % gridStep;
    const offY = ((-drive.y % gridStep) + gridStep) % gridStep;
    ctx.fillStyle = env.nightW > 0.45 ? "rgba(120,145,205,0.16)" : "rgba(100,116,139,0.16)";
    for (let gy = offY * state.squash; gy < ah; gy += gridStep * state.squash) {
      const py = Math.round(gy) * s;
      for (let gx = offX; gx < aw; gx += gridStep) {
        ctx.fillRect(Math.round(gx) * s, py, 2 * s, s);
        ctx.fillRect(Math.round(gx) * s, py, s, 2 * s);
      }
    }
  }

  // Ground rain ripples
  drawWeatherGroundEffects(ctx, aw, ah, s, env);

  // Draw tire skid marks on ground
  ctx.fillStyle = env.nightW > 0.45 ? "rgba(4,6,12,0.75)" : "rgba(30,36,46,0.38)";
  for (let i = 0; i < 240; i++) {
    const life = drive.skids[i * 3 + 2];
    if (life <= 0) continue;
    const sx = Math.round(cx + (drive.skids[i * 3] - drive.x));
    const sy = Math.round(cy + (drive.skids[i * 3 + 1] - drive.y) * state.squash);
    if (sx < 0 || sx >= aw || sy < 0 || sy >= ah) continue;
    ctx.fillRect(sx * s, sy * s, 2 * s, 2 * s);
  }

  // Draw crisp dual left + right headlight beams on ground at sunset/night
  if (state.lighting && env.emisGlow > 0.1) {
    const fx = Math.cos(drive.heading), fy = Math.sin(drive.heading);
    const rx = -fy, ry = fx;
    for (const side of [-5, 5]) {
      for (let d = 14; d <= 48; d += 4) {
        const tBeam = (d - 14) / 34;
        const alpha = env.emisGlow * (0.30 + wet * 0.14) * (1 - tBeam * 0.72);
        ctx.fillStyle = `rgba(255, 242, 182, ${alpha.toFixed(2)})`;
        const spread = 2 + d * 0.16;
        const hx = cx + fx * d + rx * side;
        const hy = cy + (fy * d + ry * side) * state.squash;
        const wPx = Math.max(2, Math.round(spread * 1.8));
        const hPx = Math.max(2, Math.round(spread * 1.1 * state.squash));
        ctx.fillRect(Math.round(hx - wPx / 2) * s, Math.round(hy - hPx / 2) * s, wPx * s, hPx * s);
      }
    }
  }

  // Draw exhaust / drift puffs behind/rising
  for (let i = 0; i < 96; i++) {
    const base = i * 6;
    const life = drive.puffs[base + 5];
    if (life <= 0) continue;
    const px = Math.round(cx + (drive.puffs[base] - drive.x));
    const py = Math.round(cy + (drive.puffs[base + 1] - drive.y) * state.squash - drive.puffs[base + 2]);
    const sz = life > 0.5 ? 3 : 2;
    ctx.fillStyle = env.nightW > 0.45
      ? `rgba(170,185,220,${(life * 0.45).toFixed(2)})`
      : `rgba(110,120,136,${(life * 0.5).toFixed(2)})`;
    ctx.fillRect(px * s, py * s, sz * s, sz * s);
  }

  // Gather Y-sorted world props (tiling seamlessly around vehicle) + vehicle itself!
  const drawList = [{ kind: "hero", sx: cx, sy: cy }];
  if (world !== "grid") {
    const tileX = 128, tileY = 128;
    const tileProps = world === "street"
      ? [
          { key: "lamp", vol: PROCEDURAL_PROPS.lamp, x: 24, y: -35, rot: 90 },
          { key: "kiosk", vol: PROCEDURAL_PROPS.kiosk, x: 86, y: -38, rot: 0 },
          { key: "bollard", vol: PROCEDURAL_PROPS.bollard, x: 56, y: 34, rot: 0 },
          { key: "lamp", vol: PROCEDURAL_PROPS.lamp, x: 108, y: 38, rot: 270 },
        ]
      : [
          { key: "pine", vol: PROCEDURAL_PROPS.pine, x: 22, y: 24, rot: 0 },
          { key: "pine", vol: PROCEDURAL_PROPS.pine, x: 92, y: 34, rot: 90 },
          { key: "rock", vol: PROCEDURAL_PROPS.rock, x: 58, y: 88, rot: 30 },
          { key: "meadowLamp", vol: PROCEDURAL_PROPS.meadowLamp, x: 104, y: 98, rot: 120 },
        ];
    const baseTx = Math.floor(drive.x / tileX);
    const baseTy = Math.floor(drive.y / tileY);
    for (let ty = baseTy - 1; ty <= baseTy + 1; ty++) {
      for (let tx = baseTx - 1; tx <= baseTx + 1; tx++) {
        for (let i = 0; i < tileProps.length; i++) {
          const p = tileProps[i];
          const wx = tx * tileX + p.x;
          const wy = ty * tileY + p.y;
          const sx = cx + (wx - drive.x);
          const sy = cy + (wy - drive.y) * state.squash;
          if (sx < -28 || sx > aw + 28 || sy < -28 || sy > ah + 36) continue;
          drawList.push({ kind: "prop", key: p.key, vol: p.vol, rot: p.rot, sx, sy });
        }
      }
    }
  }
  drawList.sort((a, b) => a.sy - b.sy);

  const spacing = Math.max(0.4, state.spacing + drive.bounce * 0.25);
  const reflAlpha = wet * (world === "street" ? (env.nightW > 0.45 ? 0.52 : 0.36) : 0.24);
  for (let i = 0; i < drawList.length; i++) {
    const it = drawList[i];
    if (it.kind === "hero") {
      const buf = rasterizeStackIntoScratch({
        angleDeg: state.angle,
        squash: state.squash,
        spacing,
        maxSlices: state.slices,
        shadow: state.shadow,
        outline: state.outline,
        leanX: drive.lean,
      });
      const ox = Math.round(it.sx - scratch.cx) * s;
      const oy = Math.round(it.sy - scratch.baseY) * s;
      if (reflAlpha > 0.02) drawWetReflection(ctx, buf, ox, oy, s, scratch.baseY, reflAlpha);
      ctx.drawImage(buf, ox, oy, buf.width * s, buf.height * s);
    } else {
      // Cached! Zero per-frame rasterization when driving!
      const cached = getCachedPropSprite(it.key, it.vol, it.rot, state.squash, state.spacing);
      const ox = Math.round(it.sx - cached.cx) * s;
      const oy = Math.round(it.sy - cached.baseY) * s;
      if (reflAlpha > 0.02) drawWetReflection(ctx, cached.canvas, ox, oy, s, cached.baseY, reflAlpha * 0.85);
      ctx.drawImage(cached.canvas, ox, oy, cached.canvas.width * s, cached.canvas.height * s);
    }
  }

  // Weather foreground rain/snow
  drawWeatherOverlay(ctx, aw, ah, s, env);

  readout.textContent = `${Math.round(drive.speed)} px/s${drive.drifting ? " · DRIFT" : ""} · ${state.lastRenderMs.toFixed(1)}ms`;
}

// ============================================================
// TOY MODE: SHATTER (3D Bouncing Voxels + Magnetic Rebuild)
// ============================================================
function triggerShatter() {
  if (!state.vol || shatter.count === 0) return;
  const rad = (state.angle * Math.PI) / 180;
  const ca = Math.cos(rad), sa = Math.sin(rad);

  if (shatter.phase === "idle") {
    shatter.phase = "burst";
    shatter.t = 0;
    for (let i = 0; i < shatter.count; i++) {
      const rx = shatter.hx[i] * ca - shatter.hy[i] * sa;
      const ry = shatter.hx[i] * sa + shatter.hy[i] * ca;
      const rz = shatter.hz[i] * state.spacing;
      shatter.px[i] = rx; shatter.py[i] = ry; shatter.pz[i] = rz;
      const dist = Math.hypot(rx, ry) + 0.5;
      const burst = 34 + Math.random() * 58;
      shatter.vx[i] = (rx / dist) * burst + (Math.random() - 0.5) * 32;
      shatter.vy[i] = (ry / dist) * burst + (Math.random() - 0.5) * 32;
      shatter.vz[i] = 40 + Math.random() * 68 + rz * 1.4;
    }
  } else if (shatter.phase === "burst") {
    shatter.phase = "rebuild";
    shatter.t = 0;
    for (let i = 0; i < shatter.count; i++) {
      shatter.sx[i] = shatter.px[i];
      shatter.sy[i] = shatter.py[i];
      shatter.sz[i] = shatter.pz[i];
    }
  }
  state.dirty = true;
}

function updateShatter(dt) {
  if (shatter.phase === "burst") {
    shatter.t += dt;
    const g = 210;
    for (let i = 0; i < shatter.count; i++) {
      shatter.vz[i] -= g * dt;
      shatter.px[i] += shatter.vx[i] * dt;
      shatter.py[i] += shatter.vy[i] * dt;
      shatter.pz[i] += shatter.vz[i] * dt;
      if (shatter.pz[i] < 0) {
        shatter.pz[i] = 0;
        shatter.vz[i] = -shatter.vz[i] * 0.44;
        shatter.vx[i] *= 0.72;
        shatter.vy[i] *= 0.72;
        if (Math.abs(shatter.vz[i]) < 6) shatter.vz[i] = 0;
      }
    }
  } else if (shatter.phase === "rebuild") {
    shatter.t += dt * 1.55;
    const rad = (state.angle * Math.PI) / 180;
    const ca = Math.cos(rad), sa = Math.sin(rad);
    const maxZ = Math.max(1, state.vol.n - 1);
    let done = true;
    for (let i = 0; i < shatter.count; i++) {
      const zFrac = shatter.hz[i] / maxZ;
      const u = Math.max(0, Math.min(1, (shatter.t - zFrac * 0.35) / 0.65));
      if (u < 1) done = false;
      const e = 1 - Math.pow(1 - u, 3);
      const tx = shatter.hx[i] * ca - shatter.hy[i] * sa;
      const ty = shatter.hx[i] * sa + shatter.hy[i] * ca;
      const tz = shatter.hz[i] * state.spacing;
      shatter.px[i] = lerp(shatter.sx[i], tx, e);
      shatter.py[i] = lerp(shatter.sy[i], ty, e);
      shatter.pz[i] = lerp(shatter.sz[i], tz, e);
    }
    if (done) shatter.phase = "idle";
  }
}

function drawShatterFrame() {
  const vol = state.vol;
  const env = getLightingEnv(state.timeOfDay, state.sunAngle);
  const s = state.scale;
  const aw = Math.max(120, Math.ceil(Math.hypot(vol.w, vol.h) * 2.8));
  const ah = Math.max(100, Math.ceil(Math.hypot(vol.w, vol.h) * state.squash * 2.2) + vol.n * 2 + 40);
  const cw = aw * s, ch = ah * s;
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }

  if (shatter.phase === "idle") {
    const buf = rasterizeStackIntoScratch({
      angleDeg: state.angle,
      squash: state.squash,
      spacing: state.spacing,
      maxSlices: state.slices,
      shadow: state.shadow,
      outline: state.outline,
    });
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = env.bgHex;
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(buf, Math.round((aw - buf.width) / 2) * s, Math.round((ah - buf.height) / 2) * s, buf.width * s, buf.height * s);
    readout.textContent = `Click / Space to shatter · ${state.lastRenderMs.toFixed(1)}ms`;
    return;
  }

  ensureScratch(aw, ah);
  const out32 = scratch.out32;
  out32.fill(packABGR(env.bgR, env.bgG, env.bgB, 255));
  const cx = aw >> 1;
  const baseY = Math.round(ah * 0.64);

  // Shadows first
  if (state.shadow) {
    for (let i = 0; i < shatter.count; i++) {
      const gx = Math.round(cx + shatter.px[i] + shatter.pz[i] * env.shDx);
      const gy = Math.round(baseY + (shatter.py[i] + shatter.pz[i] * env.shDy) * state.squash);
      if (gx >= 0 && gx < aw && gy >= 0 && gy < ah) out32[gy * aw + gx] = env.shPacked;
    }
  }
  // Draw voxels (2x2 art-pixel cubes) sorted roughly back-to-front by screen Y
  for (let i = 0; i < shatter.count; i++) {
    const vx = Math.round(cx + shatter.px[i]);
    const vy = Math.round(baseY + shatter.py[i] * state.squash - shatter.pz[i]);
    const c = shatter.col[i];
    for (let dy = 0; dy < 2; dy++) {
      const yy = vy + dy;
      if (yy < 0 || yy >= ah) continue;
      for (let dx = 0; dx < 2; dx++) {
        const xx = vx + dx;
        if (xx >= 0 && xx < aw) out32[yy * aw + xx] = c;
      }
    }
  }
  scratch.ctx.putImageData(scratch.imgData, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(scratch.canvas, 0, 0, cw, ch);
  readout.textContent = `${shatter.phase === "burst" ? "Click / Space to rebuild" : "Rebuilding..."} · ${shatter.count} voxels · ${state.lastRenderMs.toFixed(1)}ms`;
}

// ============================================================
// MAIN FRAME DISPATCH
// ============================================================
let windShearBuf = new Float32Array(256);

function drawFrame() {
  if (!state.vol) return;
  const t0 = performance.now();
  const s = state.scale;
  const env = getLightingEnv(state.timeOfDay, state.sunAngle);

  if (state.mode === "scene") {
    drawSceneFrame();
    state.lastRenderMs = performance.now() - t0;
    return;
  }

  if (state.mode === "play") {
    if (state.toy === "drive") {
      drawDriveFrame();
      state.lastRenderMs = performance.now() - t0;
      return;
    }
    if (state.toy === "shatter") {
      drawShatterFrame();
      state.lastRenderMs = performance.now() - t0;
      return;
    }
    // Wind toy
    const n = state.slices;
    if (windShearBuf.length < n) windShearBuf = new Float32Array(n);
    const gust = 2.6 + 1.4 * Math.sin(state.windPhase * 0.7);
    const denom = Math.max(1, n - 1);
    for (let z = 0; z < n; z++) {
      const hFrac = z / denom;
      windShearBuf[z] = Math.sin(state.windPhase * 2.8 - z * 0.14) * gust * Math.pow(hFrac, 1.6);
    }
    const buf = rasterizeStackIntoScratch({
      angleDeg: state.angle,
      squash: state.squash,
      spacing: state.spacing,
      maxSlices: state.slices,
      shadow: state.shadow,
      outline: state.outline,
      shearPerSlice: windShearBuf,
    });
    const cw = buf.width * s, ch = buf.height * s;
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = env.bgHex;
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(buf, 0, 0, cw, ch);
    // Subtle pixel wind streaks
    ctx.fillStyle = env.nightW > 0.45 ? "rgba(180,205,255,0.22)" : "rgba(100,116,139,0.22)";
    for (let i = 0; i < 6; i++) {
      const wx = ((state.windPhase * (55 + i * 13) + i * 73) % (cw + 40)) - 20;
      const wy = Math.round(((i + 0.5) / 6) * ch);
      ctx.fillRect(Math.round(wx / s) * s, Math.round(wy / s) * s, (4 + (i % 3) * 2) * s, s);
    }
    state.lastRenderMs = performance.now() - t0;
    readout.textContent = `Wind · ${Math.round(((state.angle % 360) + 360) % 360)}° · ${state.lastRenderMs.toFixed(1)}ms`;
    return;
  }

  if (state.mode === "scan" && state.sideImg && state.topImg) {
    const zCount = Math.max(1, Math.min(state.slices, Math.round(state.scanZ)));
    const stackBuf = rasterizeStackIntoScratch({
      angleDeg: state.angle,
      squash: state.squash,
      spacing: state.spacing,
      maxSlices: zCount,
      shadow: state.shadow,
      outline: state.outline,
    });
    const gap = 40;
    const sideW = state.sideImg.width * s, sideH = state.sideImg.height * s;
    const topW = state.topImg.width * s, topH = state.topImg.height * s;
    const stW = stackBuf.width * s, stH = stackBuf.height * s;

    const totalW = sideW + topW + stW + gap * 4;
    const totalH = Math.max(sideH, topH, stH) + 80;
    if (canvas.width !== totalW || canvas.height !== totalH) {
      canvas.width = totalW;
      canvas.height = totalH;
    }
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = env.bgHex;
    ctx.fillRect(0, 0, totalW, totalH);

    const midY = Math.floor(totalH / 2);
    const sideX = gap, sideY = Math.floor(midY - sideH / 2);
    ctx.drawImage(state.sideImg, sideX, sideY, sideW, sideH);

    const scanFrac = 1 - (zCount - 0.5) / state.slices;
    const lineY = Math.round(sideY + scanFrac * sideH);
    ctx.fillStyle = "#2563eb";
    ctx.fillRect(sideX - 10, lineY, sideW + 20, Math.max(2, Math.floor(s / 2)));

    const topX = sideX + sideW + gap, topY = Math.floor(midY - topH / 2);
    ctx.drawImage(state.topImg, topX, topY, topW, topH);

    const stX = topX + topW + gap, stY = Math.floor(midY - stH / 2);
    ctx.drawImage(stackBuf, stX, stY, stW, stH);

    ctx.fillStyle = env.nightW > 0.45 ? "#94a3b8" : "#667085";
    ctx.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.fillText("SIDE", sideX, sideY + sideH + 18);
    ctx.fillText("TOP", topX, topY + topH + 18);
    state.lastRenderMs = performance.now() - t0;
    readout.textContent = `Z-${String(zCount).padStart(2, "0")} / ${state.slices} · ${state.lastRenderMs.toFixed(1)}ms`;
    return;
  }

  const spacing = state.mode === "exploded" && state.playing
    ? 1.0 + (0.5 - 0.5 * Math.cos(state.explodePhase)) * 2.4
    : state.spacing;

  const buf = rasterizeStackIntoScratch({
    angleDeg: state.angle,
    squash: state.squash,
    spacing,
    maxSlices: state.slices,
    shadow: state.shadow,
    outline: state.outline,
    room: state.mode === "exploded" ? Math.max(spacing, 3.4) : spacing,
  });
  const cw = buf.width * s, ch = buf.height * s;
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cw, ch);
  drawWeatherGroundEffects(ctx, buf.width, buf.height, s, env);
  if (weather.wetness > 0.02) {
    drawWetReflection(ctx, buf, 0, 0, s, scratch.baseY, weather.wetness * (env.nightW > 0.45 ? 0.5 : 0.34));
  }
  ctx.drawImage(buf, 0, 0, cw, ch);
  drawWeatherOverlay(ctx, buf.width, buf.height, s, env);
  state.lastRenderMs = performance.now() - t0;
  readout.textContent = `${Math.round(((state.angle % 360) + 360) % 360)}° · squash ${state.squash.toFixed(2)} · spacing ${spacing.toFixed(2)} · ${state.lastRenderMs.toFixed(1)}ms`;
}

let lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (state.vol) {
    let needsDraw = state.dirty;
    if (state.weather !== "clear" || weather.snowCover > 0 || weather.wetness > 0) {
      updateWeather(dt);
      needsDraw = true;
    }
    if (state.mode === "play") {
      if (state.toy === "drive") {
        updateDrive(dt);
        needsDraw = true;
      } else if (state.toy === "wind") {
        if (state.playing) {
          state.windPhase += dt;
          needsDraw = true;
        }
      } else if (state.toy === "shatter") {
        if (shatter.phase !== "idle") {
          updateShatter(dt);
          needsDraw = true;
        }
      }
    } else if (state.playing) {
      if (state.mode === "turntable" || state.mode === "scene") {
        state.angle = (state.angle + dt * (state.mode === "scene" ? 26 : 55)) % 360;
        els.angle.value = String(Math.round(state.angle));
        els.angleOut.textContent = `${Math.round(state.angle)}°`;
        needsDraw = true;
      } else if (state.mode === "scan") {
        state.scanZ += dt * Math.max(8, state.slices * 0.42);
        if (state.scanZ > state.slices + 6) state.scanZ = 1;
        needsDraw = true;
      } else if (state.mode === "exploded") {
        state.explodePhase += dt * 1.6;
        state.angle = (state.angle + dt * 28) % 360;
        needsDraw = true;
      }
    }
    if (needsDraw) {
      drawFrame();
      state.dirty = false;
    }
  }
  requestAnimationFrame(tick);
}

// View transform: mobile pinch-zoom / two-finger pan via CSS transform on the canvas.
function applyView() {
  canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.userZoom})`;
}
function resetView() { state.panX = 0; state.panY = 0; state.userZoom = 1; applyView(); }
function fitView() {
  if (!state.vol) return;
  const rect = stage.getBoundingClientRect();
  if (rect.width < 10 || rect.height < 10) return;
  const v = state.vol;
  const modelW = Math.hypot(v.w, v.h) + 10;
  const modelH = v.h * state.squash + v.n * Math.max(1, state.spacing) + 18;
  const fit = Math.min(rect.width / modelW, rect.height / modelH) * 0.96;
  const sc = Math.max(1, Math.min(14, Math.floor(fit)));
  state.scale = sc;
  els.scale.value = String(sc); els.scaleOut.textContent = sc + 'x';
  state.dirty = true;
}
const resetViewBtn = document.getElementById("resetView");
if (resetViewBtn) resetViewBtn.addEventListener("click", resetView);

// Multi-pointer gestures: 1 finger = orbit/tilt, 2 fingers = pinch-zoom + pan, double-tap = reset.
const pointers = new Map();
let drag = null;
let pinch = null;
let lastTap = 0;
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".toy-bar") || e.target.closest(".scene-bar") || e.target.closest("#resetView")) return;
  if (state.mode === "play" && state.toy === "shatter" && !e.shiftKey && pointers.size === 0) {
    triggerShatter();
    return;
  }
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    const now = performance.now();
    if (e.pointerType === "touch" && now - lastTap < 300) { resetView(); lastTap = 0; }
    else lastTap = now;
    drag = { x: e.clientX, y: e.clientY, angle: state.angle, squash: state.squash, sun: state.sunAngle, shift: e.shiftKey };
    pinch = null;
    if ((state.mode === "turntable" || state.mode === "scene") && !e.shiftKey) {
      state.playing = false;
      els.play.textContent = "Play";
    }
  } else if (pointers.size === 2) {
    drag = null;
    const pts = [...pointers.values()];
    const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    pinch = { dist: Math.hypot(dx, dy) || 1, midX: (pts[0].x + pts[1].x) / 2, midY: (pts[0].y + pts[1].y) / 2,
              zoom: state.userZoom, panX: state.panX, panY: state.panY };
  }
});
stage.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const pts = [...pointers.values()];
    const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    const dist = Math.hypot(dx, dy) || 1;
    const midX = (pts[0].x + pts[1].x) / 2, midY = (pts[0].y + pts[1].y) / 2;
    state.userZoom = Math.max(0.3, Math.min(8, pinch.zoom * (dist / pinch.dist)));
    state.panX = pinch.panX + (midX - pinch.midX);
    state.panY = pinch.panY + (midY - pinch.midY);
    applyView();
    return;
  }
  if (drag && pointers.size === 1) {
    if (drag.shift) {
      state.sunAngle = ((drag.sun + (e.clientX - drag.x) * 0.7) % 360 + 360) % 360;
      els.sun.value = String(Math.round(state.sunAngle));
      els.sunOut.textContent = `${Math.round(state.sunAngle)}°`;
    } else {
      state.angle = ((drag.angle + (e.clientX - drag.x) * 0.6) % 360 + 360) % 360;
      state.squash = Math.max(0.45, Math.min(1.0, drag.squash + (e.clientY - drag.y) * 0.002));
      els.angle.value = String(Math.round(state.angle));
      els.angleOut.textContent = `${Math.round(state.angle)}°`;
      els.squash.value = state.squash.toFixed(2);
      els.squashOut.textContent = state.squash.toFixed(2);
    }
    state.dirty = true;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) drag = null;
  else if (pointers.size === 1) {
    const p = [...pointers.values()][0];
    drag = { x: p.x, y: p.y, angle: state.angle, squash: state.squash, sun: state.sunAngle, shift: false };
  }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
window.addEventListener("resize", fitView);
// Re-fit when the stage actually gets its layout size (iframe/mobile late layout) — fixes "blank white" on open.
if (typeof ResizeObserver !== "undefined") {
  let lastW = 0, lastH = 0;
  new ResizeObserver(() => {
    const r = stage.getBoundingClientRect();
    if (Math.abs(r.width - lastW) > 1 || Math.abs(r.height - lastH) > 1) {
      lastW = r.width; lastH = r.height; fitView();
    }
  }).observe(stage);
}
setTimeout(fitView, 120);
setTimeout(fitView, 500);

function syncPlayUI() {
  const isPlay = state.mode === "play";
  const isScene = state.mode === "scene";
  toyBar.classList.toggle("visible", isPlay);
  sceneBar.classList.toggle("visible", isScene);
  driveWorldGroup.style.display = isPlay && state.toy === "drive" ? "inline-flex" : "none";
  clearPropsBtn.style.display = state.userProps.length > 0 ? "inline-block" : "none";
  stage.classList.toggle("play-drive", isPlay && state.toy === "drive");
  stage.classList.toggle("play-shatter", isPlay && state.toy === "shatter");
  if (state.toy === "drive") toyHint.textContent = "WASD / Arrows · Space drift";
  else if (state.toy === "wind") toyHint.textContent = "Live breeze · Drag to orbit";
  else toyHint.textContent = "Click or Space to shatter / rebuild";
}

// Mode controls
document.querySelectorAll("[data-mode]").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.mode = btn.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    if (state.mode === "scan") state.scanZ = 1;
    if (state.mode === "exploded") state.explodePhase = 0;
    if (state.mode === "play") {
      state.playing = true;
      els.play.textContent = "Pause";
    }
    syncPlayUI();
    state.dirty = true;
  });
});

document.querySelectorAll("[data-scene]").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.scene = btn.dataset.scene;
    document.querySelectorAll("[data-scene]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    state.dirty = true;
  });
});

document.querySelectorAll("[data-drive-world]").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.driveWorld = btn.dataset.driveWorld;
    document.querySelectorAll("[data-drive-world]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    state.dirty = true;
  });
});

document.querySelectorAll("[data-weather]").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.weather = btn.dataset.weather;
    document.querySelectorAll("[data-weather]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    if (state.weather === "rain" && weather.wetness < 0.35) weather.wetness = 0.55;
    if (state.weather === "snow" && weather.snowCover < 0.25) weather.snowCover = 0.35;
    state.dirty = true;
  });
});

clearPropsBtn.addEventListener("click", () => {
  state.userProps = [];
  propCache.clear();
  syncPlayUI();
  state.dirty = true;
});

document.querySelectorAll("[data-toy]").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.toy = btn.dataset.toy;
    document.querySelectorAll("[data-toy]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    if (state.toy === "shatter") shatter.phase = "idle";
    syncPlayUI();
    state.dirty = true;
  });
});

els.play.addEventListener("click", () => {
  state.playing = !state.playing;
  els.play.textContent = state.playing ? "Pause" : "Play";
  state.dirty = true;
});

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (state.mode === "play" && state.toy === "drive") {
    if (e.code === "KeyW" || e.code === "ArrowUp") { keys.up = true; e.preventDefault(); return; }
    if (e.code === "KeyS" || e.code === "ArrowDown") { keys.down = true; e.preventDefault(); return; }
    if (e.code === "KeyA" || e.code === "ArrowLeft") { keys.left = true; e.preventDefault(); return; }
    if (e.code === "KeyD" || e.code === "ArrowRight") { keys.right = true; e.preventDefault(); return; }
    if (e.code === "Space") { keys.brake = true; e.preventDefault(); return; }
  }
  if (e.code === "Space") {
    e.preventDefault();
    if (state.mode === "play" && state.toy === "shatter") triggerShatter();
    else els.play.click();
  }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "KeyW" || e.code === "ArrowUp") keys.up = false;
  if (e.code === "KeyS" || e.code === "ArrowDown") keys.down = false;
  if (e.code === "KeyA" || e.code === "ArrowLeft") keys.left = false;
  if (e.code === "KeyD" || e.code === "ArrowRight") keys.right = false;
  if (e.code === "Space") keys.brake = false;
});

els.angle.addEventListener("input", () => {
  state.angle = Number(els.angle.value);
  els.angleOut.textContent = `${state.angle}°`;
  state.playing = false;
  els.play.textContent = "Play";
  state.dirty = true;
});
els.squash.addEventListener("input", () => {
  state.squash = Number(els.squash.value);
  els.squashOut.textContent = state.squash.toFixed(2);
  state.dirty = true;
});
els.spacing.addEventListener("input", () => {
  state.spacing = Number(els.spacing.value);
  els.spacingOut.textContent = state.spacing.toFixed(2);
  state.dirty = true;
});
els.scale.addEventListener("input", () => {
  state.scale = Number(els.scale.value);
  els.scaleOut.textContent = `${state.scale}x`;
  state.dirty = true;
});
els.slices.addEventListener("change", () => {
  const n = Math.max(1, Number(els.slices.value) || 1);
  state.slices = n;
  if (state.sheetImg) extractSlices(state.sheetImg, n);
});
els.time.addEventListener("input", () => {
  state.timeOfDay = Number(els.time.value);
  updateStageTheme();
  state.dirty = true;
});
els.sun.addEventListener("input", () => {
  state.sunAngle = Number(els.sun.value);
  els.sunOut.textContent = `${state.sunAngle}°`;
  state.dirty = true;
});
els.light.addEventListener("change", () => { state.lighting = els.light.checked; state.dirty = true; });
els.shadow.addEventListener("change", () => { state.shadow = els.shadow.checked; state.dirty = true; });
els.outline.addEventListener("change", () => { state.outline = els.outline.checked; state.dirty = true; });

// Export 16-direction baked sprite sheet (with current lighting & shadows)
els.exportBtn.addEventListener("click", () => {
  if (!state.vol) return;
  const dirs = 16;
  const frames = [];
  for (let i = 0; i < dirs; i++) {
    const buf = rasterizeStackIntoScratch({
      angleDeg: (i * 360) / dirs,
      squash: state.squash,
      spacing: state.spacing,
      maxSlices: state.slices,
      shadow: state.shadow,
      outline: state.outline,
    });
    const copy = document.createElement("canvas");
    copy.width = buf.width;
    copy.height = buf.height;
    copy.getContext("2d").drawImage(buf, 0, 0);
    frames.push(copy);
  }
  const fw = frames[0].width, fh = frames[0].height;
  const out = document.createElement("canvas");
  out.width = fw * dirs;
  out.height = fh;
  const octx = out.getContext("2d");
  octx.imageSmoothingEnabled = false;
  frames.forEach((f, i) => octx.drawImage(f, i * fw, 0));
  const a = document.createElement("a");
  a.download = `${titleText.textContent.toLowerCase().replace(/\s+/g, "-")}-16dir.png`;
  a.href = out.toDataURL("image/png");
  a.click();
});

// File load / drag-drop (supports multi-PNG diorama drops and + Add Prop)
async function addPropFile(file) {
  const url = URL.createObjectURL(file);
  const img = await loadImage(url);
  // Infer slice count from aspect ratio if height divides width cleanly, else fall back to current slices
  const guessed = img.height > 0 && img.width >= img.height * 2
    ? Math.max(1, Math.round(img.width / img.height))
    : state.slices;
  const vol = extractVolumeFromImage(img, guessed, false);
  if (!vol) return;
  const slots = [[-26, 2], [26, 4], [-18, -16], [18, 16], [-32, -12], [32, -12]];
  const slot = slots[state.userProps.length % slots.length];
  state.userProps.push({
    name: file.name.replace(/\.[^.]+$/, ""),
    vol,
    x: slot[0],
    y: slot[1],
    rot: (state.userProps.length * 45) % 360,
  });
  if (state.mode !== "scene") {
    state.mode = "scene";
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === "scene")));
  }
  syncPlayUI();
  state.dirty = true;
}

async function loadFile(file) {
  const url = URL.createObjectURL(file);
  const img = await loadImage(url);
  state.sheetImg = img;
  state.topImg = null;
  state.sideImg = null;
  titleText.textContent = file.name.replace(/\.[^.]+$/, "");
  extractSlices(img, state.slices);
}

document.getElementById("fileInput").addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  await loadFile(files[0]);
  for (let i = 1; i < files.length; i++) await addPropFile(files[i]);
});
document.getElementById("propInput").addEventListener("change", async (e) => {
  const files = Array.from(e.target.files || []);
  for (const f of files) await addPropFile(f);
  e.target.value = "";
});
window.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
window.addEventListener("dragleave", (e) => { if (e.target === document.documentElement) document.body.classList.remove("dragging"); });
window.addEventListener("drop", async (e) => {
  e.preventDefault();
  document.body.classList.remove("dragging");
  const files = Array.from(e.dataTransfer.files || []);
  if (!files.length) return;
  if (e.shiftKey || state.mode === "scene") {
    for (const f of files) await addPropFile(f);
  } else {
    await loadFile(files[0]);
    for (let i = 1; i < files.length; i++) await addPropFile(files[i]);
  }
});

async function init() {
  updateStageTheme();
  if (EMBEDDED) {
    titleText.textContent = EMBEDDED.title || "Sprite Stack";
    state.slices = EMBEDDED.slices;
    els.slices.value = String(EMBEDDED.slices);
    state.sheetImg = await loadImage(EMBEDDED.sheet);
    if (EMBEDDED.top) state.topImg = await loadImage(EMBEDDED.top);
    if (EMBEDDED.side) state.sideImg = await loadImage(EMBEDDED.side);
    extractSlices(state.sheetImg, state.slices, EMBEDDED.cols || state.slices);
  }
  requestAnimationFrame(tick);
}
init();
</script>
</body>
