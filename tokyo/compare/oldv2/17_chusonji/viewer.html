<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprite Stack Viewer</title>
<style>
  :root {
    --bg: #f1f4f8;
    --surface: #ffffff;
    --border: #dde3ec;
    --text: #141820;
    --muted: #667085;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #c6ceda transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .title { font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .meta { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
  .modes, .actions { display: flex; align-items: center; gap: 4px; }
  button, label.btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 4px 9px; border-radius: 4px; font: inherit; font-size: 12px; line-height: 1.2; cursor: pointer; user-select: none;
    transition: background 120ms ease, border-color 120ms ease;
  }
  button:hover, label.btn:hover { background: #f6f8fb; border-color: #c5cedb; }
  button[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
  main {
    position: relative; display: grid; place-items: center; overflow: hidden; cursor: grab; touch-action: none;
    background: var(--stage-bg, var(--bg));
    transition: background-color 180ms ease;
  }
  main:active { cursor: grabbing; }
  main.play-drive, main.play-shatter { cursor: pointer; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; position: absolute; top: 0; left: 0; transform-origin: top left; will-change: transform; }
  .toy-bar, .scene-bar {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 6px; padding: 5px 8px;
    background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    z-index: 4;
  }
  .toy-bar.visible, .scene-bar.visible { display: flex; }
  .pill-group { display: inline-flex; align-items: center; gap: 2px; }
  .pill-group button { padding: 3px 7px; font-size: 11px; }
  .toy-hint {
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
    padding: 0 4px 0 6px; border-left: 1px solid var(--border); white-space: nowrap;
  }
  .readout {
    position: absolute; right: 16px; bottom: 14px;
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums;
    color: var(--readout-color, var(--muted)); letter-spacing: 0.03em; pointer-events: none;
  }
  .drop-hint {
    position: absolute; inset: 16px; border: 1px dashed #9fb0c8; border-radius: 6px;
    display: none; place-items: center; background: rgba(241, 244, 248, 0.92); color: var(--text); font-weight: 500;
    z-index: 10;
  }
  body.dragging .drop-hint { display: grid; }
  footer {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface);
  }
  .ctrl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ctrl output {
    min-width: 36px; text-align: right; color: var(--text);
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums;
  }
  .sep { width: 1px; height: 18px; background: var(--border); }
  input[type="range"] { width: 84px; accent-color: var(--text); margin: 0; }
  input[type="number"] {
    width: 50px; padding: 3px 5px; border: 1px solid var(--border); border-radius: 4px;
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text);
  }
  input[type="checkbox"] { accent-color: var(--text); margin: 0; }
  .spacer { flex: 1; }
  #fileInput { display: none; }
  .gesture-hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    font: 11px/1.3 ui-monospace, Menlo, monospace; color: var(--readout-color, var(--muted));
    background: rgba(255,255,255,0.7); padding: 3px 9px; border-radius: 10px; pointer-events: none;
    white-space: nowrap; z-index: 3; display: none; }
  #resetView { position: absolute; right: 12px; top: 12px; z-index: 5; display: none;
    font-size: 12px; padding: 6px 10px; border-radius: 6px; }
  /* ---- mobile / touch ---- */
  @media (max-width: 760px), (pointer: coarse) {
    html, body { font-size: 12px; }
    header { padding: 6px 10px; gap: 6px; }
    .title { font-size: 13px; }
    .modes, .actions { gap: 3px; }
    button, label.btn { padding: 5px 8px; font-size: 12px; }
    main { min-height: 0; }
    footer {
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; gap: 12px;
      padding: 8px 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    footer::-webkit-scrollbar { display: none; }
    .ctrl { flex: 0 0 auto; font-size: 12px; }
    input[type="range"] { width: 70px; }
    .spacer, #footerHint { display: none; }
    .gesture-hint { display: block; }
    #resetView { display: block; }
    .readout { display: none; }
    .toy-hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <span id="titleText">Sprite Stack</span>
    <span class="meta" id="metaText">Drop a slice sheet PNG</span>
  </div>
  <div class="modes" role="group" aria-label="View mode">
    <button data-mode="turntable" aria-pressed="true">Turntable</button>
    <button data-mode="scene" aria-pressed="false">Scene</button>
    <button data-mode="scan" aria-pressed="false">Slice scan</button>
    <button data-mode="exploded" aria-pressed="false">Exploded</button>
    <button data-mode="play" aria-pressed="false">Play</button>
  </div>
  <div class="actions">
    <button id="playBtn" title="Space">Pause</button>
    <button id="exportBtn" title="Export 16-angle sprite sheet PNG">Export 16-dir</button>
    <label class="btn" for="fileInput">Load PNG</label>
    <input id="fileInput" type="file" accept="image/png,image/webp" multiple />
    <input id="propInput" type="file" accept="image/png,image/webp" multiple style="display:none" />
  </div>
</header>

<main id="stage">
  <div class="scene-bar" id="sceneBar" role="group" aria-label="Diorama scene">
    <button data-scene="street" aria-pressed="true">Neon Street</button>
    <button data-scene="island" aria-pressed="false">Meadow Island</button>
    <label class="btn" for="propInput" title="Add another slice sheet PNG to the diorama">+ Add Prop</label>
    <button id="clearPropsBtn" style="display:none" title="Remove added props">Clear</button>
    <span class="toy-hint" id="sceneHint">Drag to orbit · Drop PNGs to add</span>
  </div>
  <div class="toy-bar" id="toyBar" role="group" aria-label="Play toys">
    <button data-toy="drive" aria-pressed="true">Drive</button>
    <button data-toy="wind" aria-pressed="false">Wind</button>
    <button data-toy="shatter" aria-pressed="false">Shatter</button>
    <span class="sep"></span>
    <span class="pill-group" id="driveWorldGroup" role="group" aria-label="Drive world">
      <button data-drive-world="street" aria-pressed="true">Street</button>
      <button data-drive-world="island" aria-pressed="false">Meadow</button>
      <button data-drive-world="grid" aria-pressed="false">Grid</button>
    </span>
    <span class="toy-hint" id="toyHint">WASD / Arrows · Space drift</span>
  </div>
  <canvas id="view"></canvas>
  <button id="resetView" title="Reset zoom / pan">⟲ Reset view</button>
  <div class="gesture-hint" id="gestureHint">单指旋转 · 双指缩放/移动 · 双击复位</div>
  <div class="readout" id="readout"></div>
  <div class="drop-hint">Drop slice sheet PNGs (hold Shift to add as diorama prop)</div>
</main>

<footer>
  <label class="ctrl">Angle
    <input id="angleRange" type="range" min="0" max="360" step="1" value="35" />
    <output id="angleOut">35°</output>
  </label>
  <label class="ctrl">Squash
    <input id="squashRange" type="range" min="0.45" max="1" step="0.01" value="0.75" />
    <output id="squashOut">0.75</output>
  </label>
  <label class="ctrl">Spacing
    <input id="spacingRange" type="range" min="0" max="4" step="0.05" value="1" />
    <output id="spacingOut">1.00</output>
  </label>
  <label class="ctrl">Scale
    <input id="scaleRange" type="range" min="2" max="14" step="1" value="6" />
    <output id="scaleOut">6x</output>
  </label>
  <label class="ctrl">Slices
    <input id="slicesInput" type="number" min="1" max="256" value="15" />
  </label>
  <span class="sep"></span>
  <label class="ctrl" title="Day -> Golden Hour -> Midnight">Time
    <input id="timeRange" type="range" min="0" max="100" step="1" value="0" />
    <output id="timeOut">Day</output>
  </label>
  <label class="ctrl" title="Sun direction (or Shift+drag stage)">Sun
    <input id="sunRange" type="range" min="0" max="360" step="1" value="42" />
    <output id="sunOut">42°</output>
  </label>
  <label class="ctrl"><input id="lightChk" type="checkbox" checked /> Light</label>
  <label class="ctrl"><input id="shadowChk" type="checkbox" checked /> Shadow</label>
  <label class="ctrl"><input id="outlineChk" type="checkbox" checked /> Outline</label>
  <span class="sep"></span>
  <span class="ctrl">Weather
    <span class="pill-group" role="group" aria-label="Weather">
      <button data-weather="clear" aria-pressed="true">Clear</button>
      <button data-weather="rain" aria-pressed="false">Rain</button>
      <button data-weather="snow" aria-pressed="false">Snow</button>
    </span>
  </span>
  <span class="spacer"></span>
  <span class="meta" id="footerHint">Drag to orbit · Shift+drag sun · Space pause</span>
</footer>

// Weather engine (zero per-frame heap allocations)
const RAIN_COUNT = 110;
const RIPPLE_COUNT = 36;
const SNOW_COUNT = 100;
const weather = {
  time: 0,
  snowCover: 0,    // 0..1 smooth accumulation on upward-facing voxels
  wetness: 0,      // 0..1 smooth ground wetness / reflection strength
  // Raindrops: x, y (0..1 normalized), speed, len
  rain: new Float32Array(RAIN_COUNT * 4),
  // Ground ripples: x, y (0..1), age (0..1), maxR
  ripples: new Float32Array(RIPPLE_COUNT * 4),
  // Snowflakes: x, y (0..1), speed, phase
  snow: new Float32Array(SNOW_COUNT * 4),
};
for (let i = 0; i < RAIN_COUNT; i++) {
  weather.rain[i * 4] = Math.random();
  weather.rain[i * 4 + 1] = Math.random();
  weather.rain[i * 4 + 2] = 1.45 + Math.random() * 0.85;
  weather.rain[i * 4 + 3] = 4 + Math.floor(Math.random() * 4);
}
for (let i = 0; i < RIPPLE_COUNT; i++) {
  weather.ripples[i * 4] = Math.random();
  weather.ripples[i * 4 + 1] = 0.28 + Math.random() * 0.68;
  weather.ripples[i * 4 + 2] = Math.random();
  weather.ripples[i * 4 + 3] = 4 + Math.floor(Math.random() * 4);
}
for (let i = 0; i < SNOW_COUNT; i++) {
  weather.snow[i * 4] = Math.random();
  weather.snow[i * 4 + 1] = Math.random();
  weather.snow[i * 4 + 2] = 0.16 + Math.random() * 0.16;
  weather.snow[i * 4 + 3] = Math.random() * Math.PI * 2;
}

function ensureScratch(cw, ch) {
  if (scratch.w === cw && scratch.h === ch) return;
  scratch.w = cw;
  scratch.h = ch;
  scratch.canvas.width = cw;
  scratch.canvas.height = ch;
  scratch.imgData = scratch.ctx.createImageData(cw, ch);
  scratch.out8 = scratch.imgData.data;
  scratch.out32 = new Uint32Array(scratch.out8.buffer);
  const len = cw * ch;
  scratch.alpha = new Uint8Array(len);
  scratch.emis = new Uint8Array(len);
  scratch.shadow = new Uint8Array(len);
}

function packABGR(r, g, b, a = 255) { return ((a & 255) << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255); }
function lerp(a, b, t) { return a + (b - a) * t; }

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// Compute lighting theme parameters from timeOfDay (0..100) and sunAngle (deg)
function getLightingEnv(timeOfDay, sunAngleDeg) {
  const t = timeOfDay / 100; // 0 = Day, 0.5 = Sunset, 1 = Night
  const sunsetW = Math.max(0, 1 - Math.abs(t - 0.5) * 2.4);
  const nightW = Math.max(0, (t - 0.48) / 0.52);
  const dayW = Math.max(0, 1 - t * 2);

  // Sun elevation: high at noon (58°), low at sunset (20°), moon at night (38°)
  const elevDeg = t <= 0.5 ? lerp(58, 18, t * 2) : lerp(18, 40, (t - 0.5) * 2);
  const elev = (elevDeg * Math.PI) / 180;
  const az = (sunAngleDeg * Math.PI) / 180;
  const cosE = Math.cos(elev);
  const lx = Math.cos(az) * cosE;
  const ly = Math.sin(az) * cosE;
  const lz = Math.sin(elev);

  // Cast shadow vector per unit Z height (in art pixels on ground plane)
  const shadowLen = Math.min(1.65, Math.max(0.28, (1 / Math.max(Math.tan(elev), 0.35)) * 0.52));
  const shDx = -Math.cos(az) * shadowLen;
  const shDy = -Math.sin(az) * shadowLen;

  // Stage background RGB
  let bgR, bgG, bgB;
  if (t <= 0.5) {
    const u = t * 2;
    bgR = Math.round(lerp(241, 236, u));
    bgG = Math.round(lerp(244, 218, u));
    bgB = Math.round(lerp(248, 204, u));
  } else {
    const u = (t - 0.5) * 2;
    bgR = Math.round(lerp(236, 15, u));
    bgG = Math.round(lerp(218, 21, u));
    bgB = Math.round(lerp(204, 38, u));
  }

  // Shadow color on ground
  const shR = Math.round(lerp(lerp(186, 156, sunsetW), 7, nightW));
  const shG = Math.round(lerp(lerp(198, 134, sunsetW), 10, nightW));
  const shB = Math.round(lerp(lerp(212, 146, sunsetW), 20, nightW));

  // Outline color
  const olR = Math.round(lerp(24, 6, nightW));
  const olG = Math.round(lerp(28, 9, nightW));
  const olB = Math.round(lerp(36, 18, nightW));

  // 3-band hue-shifted multipliers: [shadowBand, midBand, litBand]
  const shMulR = lerp(lerp(0.76, 0.62, sunsetW), 0.24, nightW);
  const shMulG = lerp(lerp(0.80, 0.58, sunsetW), 0.28, nightW);
  const shMulB = lerp(lerp(0.90, 0.78, sunsetW), 0.44, nightW);

  const midMulR = lerp(lerp(0.97, 1.00, sunsetW), 0.38, nightW);
  const midMulG = lerp(lerp(0.98, 0.86, sunsetW), 0.44, nightW);
  const midMulB = lerp(lerp(1.00, 0.82, sunsetW), 0.62, nightW);

  const litMulR = lerp(lerp(1.10, 1.24, sunsetW), 0.58, nightW);
  const litMulG = lerp(lerp(1.08, 1.04, sunsetW), 0.66, nightW);
  const litMulB = lerp(lerp(1.03, 0.84, sunsetW), 0.88, nightW);

  // Emissive strength ramps smoothly from sunset into night
  const emisGlow = Math.max(0, Math.min(1, (t - 0.32) / 0.42));

  return {
    t, dayW, sunsetW, nightW, emisGlow,
    lx, ly, lz, shDx, shDy,
    bgR, bgG, bgB, bgHex: `rgb(${bgR}, ${bgG}, ${bgB})`,
    shPacked: packABGR(shR, shG, shB),
    olPacked: packABGR(olR, olG, olB),
    shMulR, shMulG, shMulB,
    midMulR, midMulG, midMulB,
    litMulR, litMulG, litMulB,
  };
}

function updateStageTheme() {
  const env = getLightingEnv(state.timeOfDay, state.sunAngle);
  stage.style.setProperty("--stage-bg", env.bgHex);
  stage.style.setProperty("--readout-color", env.nightW > 0.45 ? "#8b98b8" : "var(--muted)");
  if (state.timeOfDay < 25) els.timeOut.textContent = "Day";
  else if (state.timeOfDay < 72) els.timeOut.textContent = "Sunset";
  else els.timeOut.textContent = "Night";
}

// Build a compact voxel volume (normals, AO, emissive, snowMask, bounds) from raw occupancy + RGB
function buildVolumeFromPixels(w, h, count, occ, rgb, rgb32, bounds, opts = {}) {
  const area = w * h;
  const total = count * area;
  const normX = new Float32Array(total);
  const normY = new Float32Array(total);
  const normZ = new Float32Array(total);
  const ao = new Float32Array(total);
  const surfaceMask = new Uint8Array(total);
  const colorCounts = new Map();
  let surfCount = 0;

  const at = (z, y, x) => (z >= 0 && z < count && y >= 0 && y < h && x >= 0 && x < w) ? occ[z * area + y * w + x] : 0;

  for (let z = 0; z < count; z++) {
    const b = bounds[z];
    if (b.empty) continue;
    const zBase = z * area;
    for (let y = b.minY; y <= b.maxY; y++) {
      const row = zBase + y * w;
      for (let x = b.minX; x <= b.maxX; x++) {
        const idx = row + x;
        if (!occ[idx]) continue;

        const xp = at(z, y, x + 1), xm = at(z, y, x - 1);
        const yp = at(z, y + 1, x), ym = at(z, y - 1, x);
        const zp = at(z + 1, y, x), zm = at(z - 1, y, x);

        const isSurf = !(xp && xm && yp && ym && zp && zm);
        if (isSurf) {
          surfaceMask[idx] = 1;
          surfCount++;
          const key = rgb32[idx];
          colorCounts.set(key, (colorCounts.get(key) || 0) + 1);
        }

        let gx = (xm - xp) * 2
          + (at(z, y - 1, x - 1) - at(z, y - 1, x + 1))
          + (at(z, y + 1, x - 1) - at(z, y + 1, x + 1))
          + (at(z + 1, y, x - 1) - at(z + 1, y, x + 1))
          + (at(z - 1, y, x - 1) - at(z - 1, y, x + 1));
        let gy = (ym - yp) * 2
          + (at(z, y - 1, x - 1) - at(z, y + 1, x - 1))
          + (at(z, y - 1, x + 1) - at(z, y + 1, x + 1))
          + (at(z + 1, y - 1, x) - at(z + 1, y + 1, x))
          + (at(z - 1, y - 1, x) - at(z - 1, y + 1, x));
        let gz = (zm - zp) * 2
          + (at(z - 1, y, x - 1) - at(z + 1, y, x - 1))
          + (at(z - 1, y, x + 1) - at(z + 1, y, x + 1))
          + (at(z - 1, y - 1, x) - at(z + 1, y - 1, x))
          + (at(z - 1, y + 1, x) - at(z + 1, y + 1, x));

        const mag = Math.hypot(gx, gy, gz);
        if (mag > 1e-4) {
          normX[idx] = gx / mag;
          normY[idx] = gy / mag;
          normZ[idx] = gz / mag;
        } else {
          normX[idx] = 0; normY[idx] = 0; normZ[idx] = 1;
        }

        const upperOcc = zp + at(z + 1, y - 1, x) + at(z + 1, y + 1, x) + at(z + 1, y, x - 1) + at(z + 1, y, x + 1);
        ao[idx] = 1.0 - upperOcc * 0.042;
      }
    }
  }

  // Emissive detection (either explicit mask for procedural props, or smart auto-detect)
  const emis = opts.explicitEmis ? opts.explicitEmis : new Uint8Array(total);
  const emissiveSeeds = [];
  if (!opts.explicitEmis) {
    const dominant = new Set();
    if (surfCount > 0) {
      for (const [k, c] of colorCounts.entries()) {
        if (c / surfCount > 0.14) dominant.add(k);
      }
    }
    for (let z = 0; z < count; z++) {
      const b = bounds[z];
      if (b.empty) continue;
      const zBase = z * area;
      for (let y = b.minY; y <= b.maxY; y++) {
        const row = zBase + y * w;
        for (let x = b.minX; x <= b.maxX; x++) {
          const idx = row + x;
          if (!surfaceMask[idx]) continue;
          if (dominant.has(rgb32[idx])) continue;
          const r = rgb[idx * 3], g = rgb[idx * 3 + 1], bl = rgb[idx * 3 + 2];
          const luma = 0.299 * r + 0.587 * g + 0.114 * bl;
          const maxC = r > g ? (r > bl ? r : bl) : (g > bl ? g : bl);
          const minC = r < g ? (r < bl ? r : bl) : (g < bl ? g : bl);
          const sat = (maxC - minC) / (maxC || 1);
          if ((luma >= 180 && (sat >= 0.30 || luma >= 232)) || (maxC >= 215 && sat >= 0.62 && luma >= 110)) {
            emis[idx] = 1;
            emissiveSeeds.push({ x: x - w * 0.5, y: y - h * 0.5, z, r, g, b: bl });
          }
        }
      }
    }
  } else {
    for (let z = 0; z < count; z++) {
      const b = bounds[z];
      if (b.empty) continue;
      const zBase = z * area;
      for (let y = b.minY; y <= b.maxY; y++) {
        const row = zBase + y * w;
        for (let x = b.minX; x <= b.maxX; x++) {
          const idx = row + x;
          if (emis[idx]) emissiveSeeds.push({ x: x - w * 0.5, y: y - h * 0.5, z, r: rgb[idx * 3], g: rgb[idx * 3 + 1], b: rgb[idx * 3 + 2] });
        }
      }
    }
  }

  // Precompute snow accumulation mask: exposed upward-facing non-emissive voxels (normZ > 0.58)
  const snowMask = new Uint8Array(total);
  for (let z = 0; z < count; z++) {
    const b = bounds[z];
    if (b.empty) continue;
    const zBase = z * area;
    for (let y = b.minY; y <= b.maxY; y++) {
      const row = zBase + y * w;
      for (let x = b.minX; x <= b.maxX; x++) {
        const idx = row + x;
        if (!occ[idx] || emis[idx]) continue;
        if (normZ[idx] > 0.42 && (z === count - 1 || !occ[idx + area])) {
          // Vary threshold slightly with deterministic spatial hash so snow accumulates organically
          snowMask[idx] = 1 + ((x * 7 + y * 13 + z * 3) & 3); // 1..4
        }
      }
    }
  }

  const lightPools = [];
  if (emissiveSeeds.length > 0) {
    const maxPools = opts.maxPools || 20;
    const step = Math.max(1, Math.floor(emissiveSeeds.length / maxPools));
    for (let i = 0; i < emissiveSeeds.length && lightPools.length < maxPools; i += step) {
      lightPools.push(emissiveSeeds[i]);
    }
  }

  if (opts.populateShatter) {
    const surfList = [];
    for (let z = 0; z < count; z++) {
      const b = bounds[z];
      if (b.empty) continue;
      const zBase = z * area;
      for (let y = b.minY; y <= b.maxY; y++) {
        const row = zBase + y * w;
        for (let x = b.minX; x <= b.maxX; x++) {
          const idx = row + x;
          if (surfaceMask[idx]) surfList.push({ x: x - w * 0.5, y: y - h * 0.5, z, col: rgb32[idx], em: emis[idx] });
        }
      }
    }
    const sStep = Math.max(1, Math.ceil(surfList.length / 700));
    let sCount = 0;
    for (let i = 0; i < surfList.length && sCount < 700; i += sStep) {
      const v = surfList[i];
      shatter.hx[sCount] = v.x; shatter.hy[sCount] = v.y; shatter.hz[sCount] = v.z;
      shatter.col[sCount] = v.col; shatter.em[sCount] = v.em;
      sCount++;
    }
    shatter.count = sCount;
    shatter.phase = "idle";
  }

  return {
    n: count, w, h, area,
    occ, rgb, rgb32, normX, normY, normZ, ao, emis, snowMask,
    bounds, lightPools,
  };
}

function extractVolumeFromImage(img, count, populateShatter = false, cols = count) {
  const rows = Math.ceil(count / cols);
  const w = Math.floor(img.width / cols);
  const h = Math.floor(img.height / rows);
  if (w < 1 || h < 1) return null;

  // Read one slice at a time into a SMALL tile canvas. A single full-strip offscreen
  // canvas can exceed mobile canvas-area limits (iOS ~16M px) -> blank/"all white" model.
  const tile = document.createElement("canvas");
  tile.width = w;
  tile.height = h;
  const tctx = tile.getContext("2d", { willReadFrequently: true });
  tctx.imageSmoothingEnabled = false;

  const area = w * h;
  const total = count * area;
  const occ = new Uint8Array(total);
  const rgb = new Uint8Array(total * 3);
  const rgb32 = new Uint32Array(total);
  const bounds = new Array(count);

  for (let z = 0; z < count; z++) {
    const sc = z % cols, sr = Math.floor(z / cols);
    tctx.clearRect(0, 0, w, h);
    tctx.drawImage(img, sc * w, sr * h, w, h, 0, 0, w, h);
    const data = tctx.getImageData(0, 0, w, h).data;
    const base = z * area;
    let minX = w, maxX = -1, minY = h, maxY = -1;
    for (let y = 0; y < h; y++) {
      const row = y * w;
      for (let x = 0; x < w; x++) {
        const i = row + x;
        const p = i * 4;
        if (data[p + 3] > 0) {
          const idx = base + i;
          occ[idx] = 1;
          const r = data[p], g = data[p + 1], b = data[p + 2];
          rgb[idx * 3] = r;
          rgb[idx * 3 + 1] = g;
          rgb[idx * 3 + 2] = b;
          rgb32[idx] = packABGR(r, g, b, 255);
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    bounds[z] = maxX >= minX
      ? { minX, maxX, minY, maxY, empty: false }
      : { minX: 0, maxX: 0, minY: 0, maxY: 0, empty: true };
  }

  return buildVolumeFromPixels(w, h, count, occ, rgb, rgb32, bounds, { populateShatter });
}

function extractSlices(img, count, cols = count) {
  const vol = extractVolumeFromImage(img, count, true, cols);
  if (!vol) return;
  state.vol = vol;
  state.scanZ = count;
  state.dirty = true;
  metaText.textContent = `${count} slices · ${vol.w}×${vol.h}px`;

  const ideal = Math.max(2, Math.min(10, Math.floor(320 / Math.max(vol.w, vol.h, count * 2))));
  state.scale = ideal;
  els.scale.value = String(ideal);
  els.scaleOut.textContent = `${ideal}x`;
  resetView();
  fitView();
}

// Compute tight rotated screen-space AABB into module-level _sb (zero GC allocation)
function sliceScreenBounds(b, w, h, cx, yCenter, ca, sa, squash, cw, ch) {
  const x0 = b.minX - w * 0.5, x1 = b.maxX + 1 - w * 0.5;
  const y0 = b.minY - h * 0.5, y1 = b.maxY + 1 - h * 0.5;
  const c0x = x0 * ca - y0 * sa, c0y = (x0 * sa + y0 * ca) * squash;
  const c1x = x1 * ca - y0 * sa, c1y = (x1 * sa + y0 * ca) * squash;
  const c2x = x0 * ca - y1 * sa, c2y = (x0 * sa + y1 * ca) * squash;
  const c3x = x1 * ca - y1 * sa, c3y = (x1 * sa + y1 * ca) * squash;
  let minCx = c0x; if (c1x < minCx) minCx = c1x; if (c2x < minCx) minCx = c2x; if (c3x < minCx) minCx = c3x;
  let maxCx = c0x; if (c1x > maxCx) maxCx = c1x; if (c2x > maxCx) maxCx = c2x; if (c3x > maxCx) maxCx = c3x;
  let minCy = c0y; if (c1y < minCy) minCy = c1y; if (c2y < minCy) minCy = c2y; if (c3y < minCy) minCy = c3y;
  let maxCy = c0y; if (c1y > maxCy) maxCy = c1y; if (c2y > maxCy) maxCy = c2y; if (c3y > maxCy) maxCy = c3y;
  _sb[0] = Math.max(0, Math.floor(cx + minCx) - 1);
  _sb[1] = Math.min(cw - 1, Math.ceil(cx + maxCx) + 1);
  _sb[2] = Math.max(0, Math.floor(yCenter + minCy) - 1);
  _sb[3] = Math.min(ch - 1, Math.ceil(yCenter + maxCy) + 1);
}

// Ultra-fast zero-allocation software rasterizer with 3D normals, projected 3D shadows, snow cap, and night emissive glow
function rasterizeStackIntoScratch({
  vol = state.vol,
  angleDeg, squash, spacing, maxSlices, shadow, outline,
  room = spacing,
  cwOverride = 0, chOverride = 0, cxOverride = 0, baseYOverride = 0,
  clearBg = false,
  shearPerSlice = null,
  leanX = 0,
}) {
  if (!vol) return null;
  const n = Math.min(vol.n, Math.max(1, maxSlices || vol.n));
  const { w, h, area, occ, rgb, rgb32, normX, normY, normZ, ao, emis, snowMask, bounds, lightPools } = vol;
  const env = getLightingEnv(state.timeOfDay, state.sunAngle);

  const diag = Math.ceil(Math.hypot(w, h)) + 6;
  const liftMax = Math.ceil((vol.n - 1) * Math.max(room, 1));
  const shadowPad = shadow ? Math.ceil(vol.n * 1.4) : 0;
  const cw = cwOverride || (diag + 16 + shadowPad * 2);
  const ch = chOverride || (Math.ceil(diag * squash) + liftMax + 20 + Math.ceil(shadowPad * squash));
  const cx = cxOverride || (cw >> 1);
  const baseY = baseYOverride || (ch - Math.ceil((diag * squash) / 2) - 8 - Math.ceil(shadowPad * squash * 0.45));

  ensureScratch(cw, ch);
  const out32 = scratch.out32;
  const out8 = scratch.out8;
  const alphaMask = scratch.alpha;
  const emisMask = scratch.emis;
  const shadowMask = scratch.shadow;

  if (clearBg) {
    out32.fill(packABGR(env.bgR, env.bgG, env.bgB, 255));
  } else {
    out32.fill(0);
  }
  alphaMask.fill(0);
  emisMask.fill(0);

  const rad = (angleDeg * Math.PI) / 180;
  const ca = Math.cos(rad);
  const sa = Math.sin(rad);
  const invSquash = 1 / Math.max(squash, 0.1);

  // Rotate world light vector into object-local space once per frame
  const objLx = env.lx * ca + env.ly * sa;
  const objLy = -env.lx * sa + env.ly * ca;
  const objLz = env.lz;

  // 1. True 3D projected cast shadow on ground plane
  if (shadow) {
    shadowMask.fill(0);
    const shStep = n > 44 ? 2 : 1;
    const invN = 1 / Math.max(1, n - 1);
    for (let z = 0; z < n; z += shStep) {
      const b = bounds[z];
      if (b.empty) continue;
      const zBase = z * area;
      const sxOff = shearPerSlice ? shearPerSlice[z] : leanX * (z * invN);
      const scx = cx + sxOff + z * spacing * env.shDx;
      const scy = baseY + 1 + z * spacing * env.shDy * squash;
      sliceScreenBounds(b, w, h, scx, scy, ca, sa, squash, cw, ch);
      const xMin = _sb[0], xMax = _sb[1], yMin = _sb[2], yMax = _sb[3];
      if (xMin > xMax || yMin > yMax) continue;

      for (let y = yMin; y <= yMax; y++) {
        const dy = (y - scy) * invSquash;
        let sx = (xMin - scx) * ca + dy * sa + w * 0.5;
        let sy = -(xMin - scx) * sa + dy * ca + h * 0.5;
        let idx = y * cw + xMin;
        for (let x = xMin; x <= xMax; x++, idx++, sx += ca, sy -= sa) {
          if (shadowMask[idx]) continue;
          const ix = sx | 0, iy = sy | 0;
          if (sx >= 0 && sy >= 0 && ix < w && iy < h && occ[zBase + iy * w + ix]) {
            shadowMask[idx] = 1;
            out32[idx] = env.shPacked;
          }
        }
      }
    }
  }

  // 2. Ground emissive light pools at sunset / night (rendered under the stack)
  if (state.lighting && env.emisGlow > 0.04 && lightPools.length > 0) {
    const glow = env.emisGlow * 0.52;
    const radPx = 10;
    const radSq = radPx * radPx;
    for (let i = 0; i < lightPools.length; i++) {
      const lp = lightPools[i];
      const gx = Math.round(cx + (lp.x * ca - lp.y * sa));
      const gy = Math.round(baseY + (lp.x * sa + lp.y * ca) * squash);
      const y0 = Math.max(0, gy - Math.ceil(radPx * squash));
      const y1 = Math.min(ch - 1, gy + Math.ceil(radPx * squash));
      const x0 = Math.max(0, gx - radPx);
      const x1 = Math.min(cw - 1, gx + radPx);
      for (let y = y0; y <= y1; y++) {
        const dy = (y - gy) * invSquash;
        const dy2 = dy * dy;
        for (let x = x0; x <= x1; x++) {
          const dx = x - gx;
          const d2 = dx * dx + dy2;
          if (d2 >= radSq) continue;
          const f = d2 < radSq * 0.35 ? glow : glow * 0.45;
          const p = (y * cw + x) * 4;
          if (out8[p + 3] === 0) {
            out8[p] = clampByte(env.bgR + lp.r * f);
            out8[p + 1] = clampByte(env.bgG + lp.g * f);
            out8[p + 2] = clampByte(env.bgB + lp.b * f);
            out8[p + 3] = Math.round(Math.min(255, f * 260));
          } else {
            out8[p] = clampByte(out8[p] + lp.r * f);
            out8[p + 1] = clampByte(out8[p + 1] + lp.g * f);
            out8[p + 2] = clampByte(out8[p + 2] + lp.b * f);
          }
        }
      }
    }
  }

  // 3. Slice stack rasterization (bottom to top, tight AABB + incremental scanlines + real-time Snow Cap)
  const useLight = state.lighting;
  const emisGlow = env.emisGlow;
  const shR = env.shMulR, shG = env.shMulG, shB = env.shMulB;
  const midR = env.midMulR, midG = env.midMulG, midB = env.midMulB;
  const litR = env.litMulR, litG = env.litMulG, litB = env.litMulB;
  const snowLevel = weather.snowCover * 4.2; // 0..4.2 compared against snowMask (1..4)
  const hasSnow = snowLevel > 0.25;
  const invN = 1 / Math.max(1, n - 1);

  for (let z = 0; z < n; z++) {
    const b = bounds[z];
    if (b.empty) continue;
    const zBase = z * area;
    const lift = Math.round(z * spacing);
    const sxOff = shearPerSlice ? shearPerSlice[z] : leanX * (z * invN);
    const sliceCx = cx + sxOff;
    const yCenter = baseY - lift;
    sliceScreenBounds(b, w, h, sliceCx, yCenter, ca, sa, squash, cw, ch);
    const xMin = _sb[0], xMax = _sb[1], yMin = _sb[2], yMax = _sb[3];
    if (xMin > xMax || yMin > yMax) continue;

    for (let y = yMin; y <= yMax; y++) {
      const dy = (y - yCenter) * invSquash;
      let sx = (xMin - sliceCx) * ca + dy * sa + w * 0.5;
      let sy = -(xMin - sliceCx) * sa + dy * ca + h * 0.5;
      let idx = y * cw + xMin;

      for (let x = xMin; x <= xMax; x++, idx++, sx += ca, sy -= sa) {
        if (sx < 0 || sy < 0) continue;
        const ix = sx | 0, iy = sy | 0;
        if (ix >= w || iy >= h) continue;
        const vIdx = zBase + iy * w + ix;
        if (!occ[vIdx]) continue;

        alphaMask[idx] = 1;
        const isSnow = hasSnow && snowMask[vIdx] > 0 && snowMask[vIdx] <= snowLevel;

        if (!useLight) {
          out32[idx] = isSnow ? 0xfff8f4ee : rgb32[vIdx];
          continue;
        }

        if (emis[vIdx] && emisGlow > 0.05) {
          emisMask[idx] = 1;
          const p3 = vIdx * 3;
          const boost = 1 + emisGlow * 0.42;
          const r = clampByte(rgb[p3] * boost + emisGlow * 28);
          const g = clampByte(rgb[p3 + 1] * boost + emisGlow * 24);
          const bl = clampByte(rgb[p3 + 2] * boost + emisGlow * 18);
          out32[idx] = (0xff000000 | (bl << 16) | (g << 8) | r);
          continue;
        }

        const ndotl = normX[vIdx] * objLx + normY[vIdx] * objLy + normZ[vIdx] * objLz;
        const occAO = ao[vIdx];
        let mr, mg, mb;
        if (ndotl > 0.36) {
          mr = litR * occAO; mg = litG * occAO; mb = litB * occAO;
        } else if (ndotl > -0.14) {
          mr = midR * occAO; mg = midG * occAO; mb = midB * occAO;
        } else {
          mr = shR * occAO; mg = shG * occAO; mb = shB * occAO;
        }
        let br, bg, bb;
        if (isSnow) {
          br = 238; bg = 245; bb = 255;
        } else {
          const p3 = vIdx * 3;
          br = rgb[p3]; bg = rgb[p3 + 1]; bb = rgb[p3 + 2];
        }
        const rr = (br * mr) | 0;
        const gg = (bg * mg) | 0;
        const bl = (bb * mb) | 0;
        out32[idx] = (0xff000000 | ((bl > 255 ? 255 : bl) << 16) | ((gg > 255 ? 255 : gg) << 8) | (rr > 255 ? 255 : rr));
      }
    }
  }

  // 4. Crisp 1px outer pixel outline
  if (outline) {
    const olPacked = env.olPacked;
    for (let y = 1; y < ch - 1; y++) {
      let idx = y * cw + 1;
      for (let x = 1; x < cw - 1; x++, idx++) {
        if (alphaMask[idx]) continue;
        if (alphaMask[idx - 1] || alphaMask[idx + 1] || alphaMask[idx - cw] || alphaMask[idx + cw]) {
          out32[idx] = olPacked;
        }
      }
    }
  }

  // 5. Crisp 1px emissive pixel bloom halo at sunset/night
  if (useLight && emisGlow > 0.12) {
    const haloA = emisGlow * 0.48;
    for (let y = 1; y < ch - 1; y++) {
      let idx = y * cw + 1;
      for (let x = 1; x < cw - 1; x++, idx++) {
        if (emisMask[idx]) continue;
        let src = -1;
        if (emisMask[idx - 1]) src = idx - 1;
        else if (emisMask[idx + 1]) src = idx + 1;
        else if (emisMask[idx - cw]) src = idx - cw;
        else if (emisMask[idx + cw]) src = idx + cw;
        if (src < 0) continue;
        const sp = src * 4, dp = idx * 4;
        if (out8[dp + 3] === 0) {
          out8[dp] = out8[sp];
          out8[dp + 1] = out8[sp + 1];
          out8[dp + 2] = out8[sp + 2];
          out8[dp + 3] = Math.round(haloA * 220);
        } else {
          out8[dp] = clampByte(out8[dp] + out8[sp] * haloA);
          out8[dp + 1] = clampByte(out8[dp + 1] + out8[sp + 1] * haloA);
          out8[dp + 2] = clampByte(out8[dp + 2] + out8[sp + 2] * haloA);
        }
      }
    }
  }

  scratch.ctx.putImageData(scratch.imgData, 0, 0);
  scratch.cx = cx;
  scratch.baseY = baseY;
  return scratch.canvas;
}

// ============================================================
// PROCEDURAL VOXEL PROPS + SPRITE CACHE (Living Diorama Engine)
// ============================================================
function makeProceduralVolume(w, h, n, fillFn) {
  const area = w * h;
  const total = n * area;
  const occ = new Uint8Array(total);
  const rgb = new Uint8Array(total * 3);
  const rgb32 = new Uint32Array(total);
  const emis = new Uint8Array(total);
  const bounds = new Array(n);

  const put = (z, y, x, r, g, b, isEmis = 0) => {
    if (z < 0 || z >= n || y < 0 || y >= h || x < 0 || x >= w) return;
    const idx = z * area + y * w + x;
    occ[idx] = 1;
    rgb[idx * 3] = r; rgb[idx * 3 + 1] = g; rgb[idx * 3 + 2] = b;
    rgb32[idx] = packABGR(r, g, b, 255);
    if (isEmis) emis[idx] = 1;
  };
  fillFn(put, w, h, n);

  for (let z = 0; z < n; z++) {
    const base = z * area;
    let minX = w, maxX = -1, minY = h, maxY = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (occ[base + y * w + x]) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    bounds[z] = maxX >= minX
      ? { minX, maxX, minY, maxY, empty: false }
      : { minX: 0, maxX: 0, minY: 0, maxY: 0, empty: true };
  }
  return buildVolumeFromPixels(w, h, n, occ, rgb, rgb32, bounds, { explicitEmis: emis, maxPools: 6 });
}
